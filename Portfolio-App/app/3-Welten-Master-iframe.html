.world-bar {

<body data-master-world="vertex">
<div class="world-bar" role="group" aria-label="Designwelt wählen">
  <button type="button" data-iframe="0" data-world-key="nexora">NEXORA</button>
  <button type="button" class="is-active" data-iframe="1" data-world-key="vertex">PROFESSIONAL</button>
  <button type="button" data-iframe="2" data-world-key="freiraum">FREIRAUM</button>
  <button type="button" class="sound-toggle" id="sound-toggle" aria-pressed="false" title="Weltwechsel-Sound">Sound Off</button>
</div>
<iframe class="world-frame" title="NEXORA" data-lazy-src="NEXORA.html" src="about:blank"></iframe>
<iframe class="world-frame is-active" title="PROFESSIONAL" src="PROFESSIONAL.html"></iframe>
<iframe class="world-frame" title="FREIRAUM" data-lazy-src="FREIRAUM.html" src="about:blank"></iframe>
<script>
(function () {
  var CHAPTERS = ["home","projects","leistungen","about","contact"];
  var sharedChapter = "home";
  var bar = document.querySelector(".world-bar");
  var frames = document.querySelectorAll(".world-frame");
  var soundBtn = document.getElementById("sound-toggle");
  var soundEnabled = false;
  var lastSoundWorld = "professional";
  var switching = false;
  var loaded = { 1: true };

  function setBarHeight() {
    if (!bar) return;
    var h = Math.ceil(bar.getBoundingClientRect().height);
    if (h < 48) h = 56;
    document.documentElement.style.setProperty("--bar-h", h + "px");
  }

  function notifyFramesCleanup() {
    for (var k = 0; k < frames.length; k++) {
      postFrame(frames[k], { type: "portfolio-cleanup-transition" });
    }
  }

  function cleanupShellState() {
    if (typeof window.cleanupWorldTransition === "function") {
      window.cleanupWorldTransition(document);
    }
    notifyFramesCleanup();
  }

  function unlockShell(activeIdx) {
    switching = false;
    window.__worldTransitionRunning = false;
    document.documentElement.style.pointerEvents = "";
    document.body.style.pointerEvents = "";
    if (bar) bar.style.pointerEvents = "auto";
    bar.querySelectorAll("button[data-iframe]").forEach(function (b) {
      b.disabled = false;
      b.style.pointerEvents = "";
    });
    frames.forEach(function (f, j) {
      var on = j === activeIdx;
      f.classList.toggle("is-active", on);
      f.classList.remove("is-leaving");
      f.style.pointerEvents = on ? "auto" : "none";
    });
    setBarHeight();
  }

  var throttledSetBarHeight = (function () {
    var scheduled = false;
    return function () {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(function () {
        scheduled = false;
        setBarHeight();
      });
    };
  })();

  window.addEventListener("resize", throttledSetBarHeight, { passive: true });
  setBarHeight();
  if (bar && typeof ResizeObserver !== "undefined") {
    new ResizeObserver(setBarHeight).observe(bar);
  }

  var SOUND_FILES = {
    nexora: "assets/audio/Nexora sound.mp3",
    professional: "assets/audio/Professional sound.mp3",
    freiraum: "assets/audio/Freiraum sound.mp3",
  };

  var sounds = {};
  Object.keys(SOUND_FILES).forEach(function (key) {
    var src = SOUND_FILES[key];
    try { src = encodeURI(src).replace(/#/g, "%23"); } catch (e) {}
    var audio = new Audio(src);
    audio.preload = "none";
    audio.volume = 0.55;
    sounds[key] = audio;
  });

  function soundKeyFromIframe(i) {
    return i === 0 ? "nexora" : i === 1 ? "professional" : "freiraum";
  }

  function updateSoundButton() {
    if (!soundBtn) return;
    soundBtn.textContent = soundEnabled ? "Sound On" : "Sound Off";
    soundBtn.classList.toggle("is-on", soundEnabled);
    soundBtn.setAttribute("aria-pressed", soundEnabled ? "true" : "false");
  }

  function playWorldSwitchSound(worldKey) {
    if (!soundEnabled || worldKey === lastSoundWorld) return;
    var clip = sounds[worldKey];
    if (!clip) return;
    try {
      clip.currentTime = 0;
      var p = clip.play();
      if (p && typeof p.catch === "function") p.catch(function () {});
    } catch (e) {}
    lastSoundWorld = worldKey;
  }

  if (soundBtn) {
    soundBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      updateSoundButton();
    });
  }
  updateSoundButton();

  function isOur(win) {
    if (!win) return false;
    for (var i = 0; i < frames.length; i++) {
      try { if (frames[i].contentWindow === win) return true; } catch (e) {}
    }
    return false;
  }

  window.addEventListener("message", function (e) {
    if (!e.data) return;
    if (e.data.type === "portfolio-chapter") {
      if (!isOur(e.source)) return;
      if (typeof e.data.chapter === "string" && CHAPTERS.indexOf(e.data.chapter) >= 0) sharedChapter = e.data.chapter;
      return;
    }
    if (e.data.type === "portfolio-open-external") {
      if (!isOur(e.source)) return;
      var href = e.data.href;
      if (typeof href === "string" && /^(mailto:|tel:)/i.test(href)) {
        window.location.href = href;
      }
    }
  });

  function readChapter(f) {
    try {
      var d = f.contentDocument;
      if (!d || !d.body) return null;
      var b = d.body.getAttribute("data-current-slide");
      if (b && CHAPTERS.indexOf(b) >= 0) return b;
      var a = d.querySelector(".slide.active[data-slide]");
      if (a) { var id = a.getAttribute("data-slide"); if (id && CHAPTERS.indexOf(id) >= 0) return id; }
    } catch (err) {}
    return null;
  }

  function isTouchShell() {
    return window.matchMedia("(max-width: 1024px)").matches ||
      window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  }

  function applyChapter(f, id) {
    var ch = CHAPTERS.indexOf(id) >= 0 ? id : "home";
    var useMessageOnly = f === frames[0] && isTouchShell();
    if (useMessageOnly) {
      postFrame(f, { type: "portfolio-go-chapter", chapter: ch });
      return;
    }
    try {
      var d = f.contentDocument;
      if (d) {
        var link = d.querySelector('.menu-links a[data-go="' + ch + '"]');
        if (link) { link.click(); return; }
      }
    } catch (e1) {}
    if (f.contentWindow) {
      try { f.contentWindow.postMessage({ type: "portfolio-go-chapter", chapter: ch }, "*"); } catch (e2) {}
    }
  }

  function postFrame(f, data) {
    if (!f || !f.contentWindow) return;
    try { f.contentWindow.postMessage(data, "*"); } catch (e) {}
  }

  function setFramePaused(f, paused) {
    postFrame(f, { type: "portfolio-world-pause", paused: paused });
  }

  function activeIdx() {
    var idx = -1;
    frames.forEach(function (f, j) { if (f.classList.contains("is-active")) idx = j; });
    return idx;
  }

  function setMaster(i) {
    var btn = bar.querySelector('button[data-iframe="' + i + '"]');
    var key = btn && btn.getAttribute("data-world-key");
    if (!key) key = i === 0 ? "nexora" : i === 1 ? "vertex" : "freiraum";
    document.body.setAttribute("data-master-world", key);
  }

  function preloadFrame(i) {
    var f = frames[i];
    if (!f || loaded[i]) return;
    var lazy = f.getAttribute("data-lazy-src");
    if (!lazy) return;
    var blank = !f.src || f.src.indexOf("about:blank") !== -1;
    if (!blank) { loaded[i] = true; return; }
    f.addEventListener("load", function onLoad() {
      f.removeEventListener("load", onLoad);
      loaded[i] = true;
    });
    f.src = lazy;
  }

  function loadFrame(i) {
    return new Promise(function (resolve) {
      var f = frames[i];
      if (!f) return resolve();
      if (loaded[i]) return resolve();
      var lazy = f.getAttribute("data-lazy-src");
      if (!lazy) { loaded[i] = true; return resolve(); }
      var blank = !f.src || f.src.indexOf("about:blank") !== -1;
      if (!blank && f.contentDocument && f.contentDocument.readyState === "complete") {
        loaded[i] = true;
        return resolve();
      }
      function onLoad() {
        f.removeEventListener("load", onLoad);
        loaded[i] = true;
        resolve();
      }
      f.addEventListener("load", onLoad);
      if (blank) f.src = lazy;
    });
  }

  function applyActiveFrames(i) {
    var prev = activeIdx();
    if (prev >= 0 && prev !== i) {
      postFrame(frames[prev], { type: "portfolio-cleanup-transition" });
      setFramePaused(frames[prev], true);
    }
    frames.forEach(function (f, j) {
      var on = j === i;
      f.classList.toggle("is-active", on);
      f.style.pointerEvents = on ? "auto" : "none";
      if (on) setFramePaused(f, false);
    });
    bar.querySelectorAll("button[data-iframe]").forEach(function (b) {
      b.classList.toggle("is-active", parseInt(b.getAttribute("data-iframe"), 10) === i);
    });
    setMaster(i);
    postFrame(frames[i], { type: "portfolio-world-enter", world: soundKeyFromIframe(i) });
    if (i === 0 && isTouchShell()) {
      setTimeout(function () {
        applyChapter(frames[i], sharedChapter);
      }, 180);
    } else {
      applyChapter(frames[i], sharedChapter);
    }
    unlockShell(i);
  }

  function switchToWorldIndexInternal(i) {
    if (i < 0 || i > 2) return Promise.resolve();
    if (activeIdx() === i) {
      unlockShell(i);
      return Promise.resolve();
    }
    switching = true;
    var prev = activeIdx();
    bar.querySelectorAll("button[data-iframe]").forEach(function (b) { b.disabled = true; });
    if (prev >= 0) {
      var c = readChapter(frames[prev]);
      if (c) sharedChapter = c;
      if (prev !== i) playWorldSwitchSound(soundKeyFromIframe(i));
    }
    if (loaded[i] && frames[i].src && frames[i].src.indexOf("about:blank") === -1) {
      applyActiveFrames(i);
      return Promise.resolve();
    }
    return loadFrame(i).then(function () {
      applyActiveFrames(i);
    });
  }

  function switchToWorldIndex(i) {
    if (i < 0 || i > 2) return Promise.resolve();
    if (window.__worldTransitionRunning) {
      unlockShell(activeIdx());
      window.__worldTransitionRunning = false;
    }
    if (switching && !window.__worldTransitionRunning) unlockShell(activeIdx());

    window.__worldTransitionRunning = true;
    cleanupShellState();

    var play = typeof window.playWorldTransition === "function" ? window.playWorldTransition(soundKeyFromIframe(i)) : Promise.resolve();
    var safetyMs = window.matchMedia("(max-width: 1024px)").matches ? 3500 : 10000;
    var safety = setTimeout(function () { unlockShell(i); }, safetyMs);

    return Promise.resolve(play).then(function () {
      return switchToWorldIndexInternal(i);
    }).catch(function (err) {
      console.error(err);
      unlockShell(i);
      return switchToWorldIndexInternal(i);
    }).finally(function () {
      clearTimeout(safety);
      cleanupShellState();
      unlockShell(i);
      window.__worldTransitionRunning = false;
    });
  }

  bar.querySelectorAll("button[data-iframe]").forEach(function (btn) {
    var idx = parseInt(btn.getAttribute("data-iframe"), 10);
    btn.addEventListener("mouseenter", function () { preloadFrame(idx); });
    btn.addEventListener("touchstart", function () { preloadFrame(idx); }, { passive: true });
    btn.addEventListener("focus", function () { preloadFrame(idx); });
  });

  bar.addEventListener("click", function (e) {
    if (e.target.closest("#sound-toggle")) return;
    var btn = e.target.closest("button[data-iframe]");
    if (!btn) return;
    switchToWorldIndex(parseInt(btn.getAttribute("data-iframe"), 10));
  });

  window.switchToWorldIndex = switchToWorldIndex;
  if (typeof window.cleanupWorldTransition === "function") {
    window.cleanupWorldTransition(document);
  }
  cleanupShellState();

  var ROUTE_CHAPTER = {
    "/": "home",
    "/projekte": "projects",
    "/leistungen": "leistungen",
    "/ueber-mich": "about",
    "/kontakt": "contact"
  };

  function chapterFromShellPath() {
    var p = (location.pathname || "/").replace(/\/$/, "") || "/";
    return ROUTE_CHAPTER[p] || "home";
  }

  function applyShellRoute() {
    var ch = chapterFromShellPath();
    sharedChapter = ch;
    var idx = activeIdx();
    if (idx < 0) idx = 1;
    var f = frames[idx];
    if (!f) return;
    function send() {
      postFrame(f, { type: "portfolio-go-chapter", chapter: ch });
    }
    if (f.contentDocument && f.contentDocument.readyState === "complete") send();
    else f.addEventListener("load", send, { once: true });
  }

  window.addEventListener("popstate", applyShellRoute);
  applyShellRoute();
})();
</script>
