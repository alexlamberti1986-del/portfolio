<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Diese Welt wurde nicht gefunden | Alex Lamberti</title>
  <meta
    name="description"
    content="Die gesuchte Seite existiert nicht mehr oder befindet sich an einem anderen Ort im Multiversum."
  />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/assets/favicon/favicon.ico" />
  <style>
    :root {
      --bg: #02030b;
      --text: #e8eef8;
      --muted: rgba(232, 238, 248, 0.72);
      --accent: #7dd3fc;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(56, 189, 248, 0.18), transparent 55%),
        radial-gradient(900px 500px at 90% 10%, rgba(99, 102, 241, 0.14), transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .skip {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
      z-index: 10;
      padding: 12px 16px;
      background: #0a1220;
      color: var(--text);
      text-decoration: none;
      border: 2px solid rgba(125, 211, 252, 0.55);
      border-radius: 8px;
    }
    .skip:focus,
    .skip:focus-visible {
      left: 12px;
      top: 12px;
      width: auto;
      height: auto;
      overflow: visible;
    }
    header {
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    header a {
      color: var(--muted);
      text-decoration: none;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    header .brand {
      color: var(--text);
      font-weight: 700;
    }
    header nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
    }
    main {
      min-height: calc(100dvh - 80px);
      display: grid;
      place-items: center;
      padding: 32px 20px;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      letter-spacing: 0.02em;
    }
    p {
      margin: 0 0 28px;
      max-width: 36rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.03em;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }
    .actions a:hover,
    .actions a:focus-visible,
    header a:focus-visible {
      border-color: rgba(125, 211, 252, 0.7);
      box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.25);
      outline: none;
    }
    .actions a.primary {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(99, 102, 241, 0.35));
      border-color: rgba(125, 211, 252, 0.45);
    }
    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt springen</a>
  <header>
    <a class="brand" href="/">Alex Lamberti</a>
    <nav aria-label="Hauptnavigation">
      <a href="/">Start</a>
      <a href="/leistungen">Leistungen</a>
      <a href="/projekte">Projekte</a>
      <a href="/ueber-mich">Über mich</a>
      <a href="/kontakt">Projekt besprechen</a>
    </nav>
  </header>
  <main id="main">
    <div>
      <h1>Diese Welt wurde nicht gefunden.</h1>
      <p>
        Die gesuchte Seite existiert nicht mehr oder befindet sich an einem anderen Ort im Multiversum.
      </p>
      <div class="actions">
        <a class="primary" href="/">Zur Startseite</a>
        <a href="/projekte">Projekte entdecken</a>
      </div>
    </div>
  </main>
</body>
</html>
