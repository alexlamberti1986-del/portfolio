/* Step 3 & 4 cleaner two-column layout */
.panel[data-step="3"] .chip-grid,
.panel[data-step="4"] .chip-grid{
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  max-width:920px;
}

.panel[data-step="3"] .chip label,
.panel[data-step="4"] .chip label{
  min-height:82px !important;
  font-size:15px;
  padding:18px 22px;
}

@media(max-width:760px){
  .panel[data-step="3"] .chip-grid,
  .panel[data-step="4"] .chip-grid{
    grid-template-columns:1fr !important;
  }
}

.success.show{display:block}


/* Sanitrend Kundenbilder – saubere Darstellung */
.option-card .option-img img,
.hero-card .hero-img img{
  image-rendering:auto;
  backface-visibility:hidden;
  transform:translateZ(0);
  filter:saturate(1.03) contrast(1.02);
}

const chip=(n,v,t="checkbox")=>`<div class="chip"><input type="${t}" id="${id(n,v)}" name="${n}" value="${esc(v)}"><label for="${id(n,v)}">${esc(v)}</label></div>`;
const selected=()=>{const e=q('input[name="main"]:checked');return e?OPTIONS.find(x=>x.id===e.dataset.id):null};const skip=()=>selected()&&!selected().d;
const hero=st=>{let h=HERO[st];return `<div class="hero-card"><div class="hero-img"><img src="${h[2]}" alt="${esc(h[0])}" loading="lazy"></div><div class="hero-copy"><h3>${esc(h[0])}</h3><p>${esc(h[1])}</p></div></div>`};
app.innerHTML=`<div class="wrap"><main class="main"><div class="head"><div class="brand"><img class="logo" src="${LOGO_SRC}" alt="Sanitrend GmbH Logo"><span class="badge">Sanitär – Heizung – Service</span></div><h1>Sanitrend GmbH unverbindlich anfragen</h1><p class="sub">Von moderner Badsanierung über Sanitärservice bis zur präzisen Planung: Starten Sie Ihre Anfrage in wenigen Schritten.</p></div><form id="form" novalidate><input id="website" style="display:none"><div class="progress"><div class="progress-top"><strong id="stepText">Schritt 1 von 5</strong><span id="stepLabel">Hauptleistung wählen</span></div><div class="steps">${Object.entries(META).map(([n,m],i)=>`<div class="step ${i===0?'active':''}" data-step-node="${n}"><button type="button" class="step-btn" data-step-target="${n}"><div class="circle">${n}</div><div class="label">${esc(m[0])}</div></button></div>`).join("")}</div></div><div class="form-wrap"><div class="card">
<section class="panel active" data-step="1"><span class="kicker">Schritt 01</span><h2>Was interessiert Sie?</h2><p class="desc">Wählen Sie eine Hauptleistung. Bei Dampfsauna-Gerät oder einem Komplettpaket wird der Detail-Schritt automatisch übersprungen.</p><div class="divider"></div><div class="grid">${OPTIONS.map(o=>`<div class="option"><input type="radio" id="main_${o.id}" name="main" value="${esc(o.t)}" data-id="${o.id}"><label for="main_${o.id}"><span class="check"></span><div class="option-card"><div class="option-img"><img src="${o.img}" alt="${esc(o.t)}" loading="lazy"></div><div class="option-body"><span class="option-tag">${esc(o.tag)}</span><h3 class="option-title">${esc(o.t)}</h3><div class="option-sub">${esc(o.s)}</div></div></div></label></div>`).join("")}</div><div id="skipNote" class="skip-note">Hinweis: Für diese Auswahl wird Schritt 2 übersprungen.</div><div class="error" data-error-step="1"></div><div class="actions"><span></span><button type="button" class="btn primary" data-next>Weiter</button></div></section>
<section class="panel" data-step="2"><span class="kicker">Schritt 02</span><h2>Genauere Angaben</h2><p class="desc">Wählen Sie passende Unterbereiche aus.</p><div class="divider"></div>${hero(2)}<div id="details"></div><div class="error" data-error-step="2"></div><div class="actions"><button type="button" class="btn secondary" data-prev>Zurück</button><button type="button" class="btn primary" data-next>Weiter</button></div></section>
<section class="panel" data-step="3"><span class="kicker">Schritt 03</span><h2>Um welches Objekt geht es?</h2><p class="desc">Wählen Sie die passende Objektart aus und ergänzen Sie die Angaben zur Etage und Anlieferung.</p><div class="divider"></div>${hero(3)}<div class="chip-grid">${OBJECTS.map(o=>chip("object",o,"radio")).join("")}</div><div class="fields" style="margin-top:18px"><div class="field"><label>Etage</label><select class="input" id="floor"><option value="">Bitte auswählen</option>${FLOORS.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select></div><div class="field"><label>Lift vorhanden</label><select class="input" id="lift"><option value="">Bitte auswählen</option><option value="Ja">Ja</option><option value="Nein">Nein</option></select></div><div class="field full"><label>Direkte Anlieferung und Parkplätze</label><select class="input" id="deliveryParking"><option value="">Bitte auswählen</option><option value="Ja">Ja</option><option value="Nein">Nein</option></select></div></div><div class="error" data-error-step="3"></div><div class="actions"><button type="button" class="btn secondary" data-prev>Zurück</button><button type="button" class="btn primary" data-next>Weiter</button></div></section>
<section class="panel" data-step="4"><span class="kicker">Schritt 04</span><h2>Wann soll das Projekt starten?</h2><p class="desc">Wählen Sie den ungefähren Startzeitpunkt aus.</p><div class="divider"></div>${hero(4)}<div class="chip-grid">${STARTS.map(o=>chip("start",o,"radio")).join("")}</div><div class="error" data-error-step="4"></div><div class="actions"><button type="button" class="btn secondary" data-prev>Zurück</button><button type="button" class="btn primary" data-next>Weiter</button></div></section>
<section class="panel" data-step="5"><span class="kicker">Schritt 05</span><h2>Kontaktdaten</h2><p class="desc">Damit Sanitrend passend zurückmelden kann, füllen Sie bitte die Kontaktdaten aus.</p><div class="divider"></div>${hero(5)}<div class="fields"><div class="field full"><label>Firma optional</label><input class="input" id="company" autocomplete="organization" placeholder="Firma / Verwaltung / Institution"></div><div class="field"><label>Vorname <span class="req">*</span></label><input class="input" id="first" autocomplete="given-name"></div><div class="field"><label>Nachname <span class="req">*</span></label><input class="input" id="last" autocomplete="family-name"></div><div class="field"><label>Telefon <span class="req">*</span></label><input class="input" id="phone" type="tel" autocomplete="tel"></div><div class="field"><label>E-Mail <span class="req">*</span></label><input class="input" id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="name@beispiel.ch"></div><div class="field full"><label>PLZ / Ort <span class="req">*</span></label><input class="input" id="loc" autocomplete="address-level2"></div><div class="field full"><label>Wunsch</label><div class="chip-grid">${WISHES.map(o=>chip("wish",o)).join("")}</div></div><div class="field full"><label>Bemerkungen</label><textarea class="textarea" id="msg" placeholder="Beschreiben Sie kurz Ihr Projekt, den Defekt oder gewünschte Leistungen."></textarea></div><div class="field full"><div class="info-box">Nach dem Absenden wird Ihre Anfrage direkt an Sanitrend GmbH übermittelt und zusätzlich im Google Sheet gespeichert.</div></div></div><div class="success" id="formSuccess"></div><div class="error" data-error-step="5"></div><div class="actions"><button type="button" class="btn secondary" data-prev>Zurück</button><button type="submit" id="submitBtn" class="btn dark">Demo absenden</button></div></section>
</div></div></form><div class="mobile-summary"></div></main><aside class="side"><h3 class="summary-title">Ihre Übersicht</h3><p class="summary-sub">Alle Angaben werden live zusammengefasst.</p><div class="summary-box"><div class="summary-row"><div class="summary-label">Interesse</div><div class="summary-value" id="sumMain">Noch keine Auswahl</div></div><div class="summary-row"><div class="summary-label">Details</div><div class="summary-value" id="sumDetails">Noch keine Auswahl</div></div><div class="summary-row"><div class="summary-label">Objekt</div><div class="summary-value" id="sumObj">Noch keine Auswahl</div></div><div class="summary-row"><div class="summary-label">Standortdetails</div><div class="summary-value" id="sumAccess">Noch keine Angaben</div></div><div class="summary-row"><div class="summary-label">Start</div><div class="summary-value" id="sumStart">Noch keine Auswahl</div></div><div class="summary-row"><div class="summary-label">Kontakt</div><div class="summary-value" id="sumContact">Noch keine Angaben</div></div></div></aside></div>`;
function renderDetails(){const s=selected(),b=q("#details");if(!s){b.innerHTML='<div class="info-box">Bitte wählen Sie zuerst in Schritt 1 eine Hauptleistung aus.</div>';return}if(!s.d){b.innerHTML='<div class="info-box">Für diese Auswahl sind keine genaueren Angaben nötig.</div>';return}b.innerHTML=`<div class="chip-grid">${(DETAILS[s.id]||[]).map(o=>chip("details",o)).join("")}</div>`}
function err(st,m){let b=q(`[data-error-step="${st}"]`);if(b){b.textContent=m;b.classList.add("show")}}function clear(st){let b=q(`[data-error-step="${st}"]`);if(b){b.textContent="";b.classList.remove("show")}}
function steps(){return skip()?[1,3,4,5]:[1,2,3,4,5]}function next(){let a=steps(),i=a.indexOf(cur);return a[Math.min(i+1,a.length-1)]}function prev(){let a=steps(),i=a.indexOf(cur);return a[Math.max(i-1,0)]}
function valid(st,silent=false){if(!silent)clear(st);let fail=m=>{if(!silent)err(st,m);return false};if(st==1&&!selected())return fail("Bitte wählen Sie eine Hauptleistung aus.");if(st==2&&!skip()&&checked("details").length<1)return fail("Bitte wählen Sie mindestens eine genaue Angabe aus.");if(st==3&&checked("object").length<1)return fail("Bitte wählen Sie eine Objektart aus.");if(st==4&&checked("start").length<1)return fail("Bitte wählen Sie den Projektstart aus.");if(st==5){if(!val("#first")||!val("#last"))return fail("Bitte geben Sie Vorname und Nachname ein.");if(!val("#phone"))return fail("Bitte geben Sie eine Telefonnummer ein.");const emailValue=val("#email");if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2}$/.test(emailValue))return fail("Bitte geben Sie eine gültige E-Mail-Adresse ein.");if(!val("#loc"))return fail("Bitte geben Sie PLZ / Ort ein.")}return true}
function setStep(st){cur=st;qa(".panel").forEach(p=>p.classList.toggle("active",Number(p.dataset.step)==cur));q("#stepText").textContent=`Schritt ${cur} von 5`;q("#stepLabel").textContent=META[cur][1];clear(cur);summary();state();window.scrollTo({top:app.offsetTop-20,behavior:"smooth"})}
function state(){qa("[data-step-node]").forEach(n=>{let st=Number(n.dataset.stepNode),bt=n.querySelector("button");n.classList.remove("active","done");if(st==cur)n.classList.add("active");if(steps().includes(st)&&st<cur)n.classList.add("done");bt.disabled=!steps().includes(st)});let note=q("#skipNote");if(note)note.classList.toggle("show",!!skip())}
function summary(){
  let s=selected();
  const access=[
    val("#floor") ? "Etage: " + val("#floor") : "",
    val("#lift") ? "Lift: " + val("#lift") : "",
    val("#deliveryParking") ? "Anlieferung/Parkplätze: " + val("#deliveryParking") : ""
  ].filter(Boolean).join(" / ");
  q("#sumMain").textContent=s?s.t:"Noch keine Auswahl";
  q("#sumDetails").textContent=skip()?"Nicht nötig / übersprungen":(checked("details").join(", ")||"Noch keine Auswahl");
  q("#sumObj").textContent=checked("object").join(", ")||"Noch keine Auswahl";
  q("#sumAccess").textContent=access||"Noch keine Angaben";
  q("#sumStart").textContent=checked("start").join(", ")||"Noch keine Auswahl";
  q("#sumContact").textContent=[[val("#company")],[val("#first"),val("#last")].filter(Boolean).join(" "),val("#phone"),val("#email"),val("#loc")].flat().filter(Boolean).join(" / ")||"Noch keine Angaben";
  mobile();
}
function mobile(){let box=q(".mobile-summary");if(!box||window.innerWidth>1024){if(box)box.innerHTML="";return}box.innerHTML=`<div class="side" style="position:static"><h3 class="summary-title">Ihre Übersicht</h3><p class="summary-sub">Alle Angaben werden live zusammengefasst.</p><div class="summary-box">${qa(".summary-box .summary-row").map(r=>r.outerHTML).join("")}</div></div>`}

function buildSummaryText(){
  const s=selected();
  return [
    "Kunde / Formular: " + FORM_CONFIG.companyName,
    "Formular-Typ: " + FORM_CONFIG.formType,
    "",
    "Hauptleistung: " + (s?s.t:"-"),
    "Details: " + (skip()?"Nicht nötig / übersprungen":(checked("details").join(", ")||"-")),
    "Objektart: " + (checked("object").join(", ")||"-"),
    "Etage: " + (val("#floor")||"-"),
    "Lift vorhanden: " + (val("#lift")||"-"),
    "Direkte Anlieferung und Parkplätze: " + (val("#deliveryParking")||"-"),
    "Projektstart: " + (checked("start").join(", ")||"-"),
    "Wunsch: " + (checked("wish").join(", ")||"-"),
    "",
    "Firma: " + (val("#company")||"-"),
    "Vorname: " + (val("#first")||"-"),
    "Nachname: " + (val("#last")||"-"),
    "Telefon: " + (val("#phone")||"-"),
    "E-Mail: " + (val("#email")||"-"),
    "PLZ / Ort: " + (val("#loc")||"-"),
    "",
    "Bemerkungen:",
    val("#msg")||"-"
  ].join("\n");
}
function buildPayload(){
  const s=selected();
  const main=s?s.t:"";
  const details=skip()?"Nicht nötig / übersprungen":checked("details").join("\n");
  const objectText=checked("object").join("\n");
  const floorText=val("#floor");
  const liftText=val("#lift");
  const deliveryParkingText=val("#deliveryParking");
  const startText=checked("start").join("\n");
  const wishText=checked("wish").join("\n");
  const message=val("#msg");

  const payload = {
    client_id:FORM_CONFIG.clientId,
    company_name:FORM_CONFIG.companyName,
    form_type:FORM_CONFIG.formType,

    // Nur kanonische Felder senden – keine englischen/technischen Doppel-Felder.
    // Dadurch erscheinen in der Admin-Mail keine doppelten Zeilen wie service/reinigung/dienstleistung.
    service:main,
    paket:details,
    objektart:objectText,
    etage:floorText,
    lift_vorhanden:liftText,
    direkte_anlieferung_parkplaetze:deliveryParkingText,
    startzeitraum:startText,
    wunsch:wishText,
    standort:val("#loc"),

    firma:val("#company"),
    vorname:val("#first"),
    nachname:val("#last"),
    telefon:val("#phone"),
    email:val("#email"),
    nachricht:message,

    website:val("#website")
  };

  payload.mail_order_json = buildSanitrendMailOrderJson(payload, skip());
  return payload;
}

function buildSanitrendMailOrderJson(payload, detailStepSkipped){
  const fields = function(items){
    return items
      .filter(function(item){
        const value = payload[item.name];
        return value !== null && value !== undefined && String(value).trim() !== "";
      })
      .map(function(item){
        return {name:item.name, label:item.label, type:item.type || "plain"};
      });
  };

  const sections = [
    {
      section:"Schritt 1 – Interesse / Dienstleistung",
      fields:fields([
        {name:"service", label:"Interesse / Dienstleistung"}
      ])
    },
    {
      section:"Schritt 2 – Genauere Angaben",
      fields:fields([
        {name:"paket", label:"Genauere Angaben"}
      ])
    },
    {
      section:"Schritt 3 – Objekt / Anlieferung",
      fields:fields([
        {name:"objektart", label:"Objektart"},
        {name:"etage", label:"Etage"},
        {name:"lift_vorhanden", label:"Lift vorhanden"},
        {name:"direkte_anlieferung_parkplaetze", label:"Direkte Anlieferung und Parkplätze"}
      ])
    },
    {
      section:"Schritt 4 – Projektstart",
      fields:fields([
        {name:"startzeitraum", label:"Projektstart"}
      ])
    },
    {
      section:"Schritt 5 – Kontaktangaben",
      fields:fields([
        {name:"firma", label:"Firma / Institution"},
        {name:"vorname", label:"Vorname"},
        {name:"nachname", label:"Nachname"},
        {name:"telefon", label:"Telefon"},
        {name:"email", label:"E-Mail"},
        {name:"standort", label:"PLZ / Ort"},
        {name:"wunsch", label:"Wunsch"},
        {name:"nachricht", label:"Bemerkungen"}
      ])
    }
  ];

  return JSON.stringify(sections.filter(function(section){
    return section.fields && section.fields.length;
  }));
}

function showSuccess(message){
  const box=q("#formSuccess");
  if(box){box.textContent=message;box.classList.add("show");}
}
function hideSuccess(){
  const box=q("#formSuccess");
  if(box){box.textContent="";box.classList.remove("show");}
}

app.addEventListener("click",e=>{let n=e.target.closest("[data-next]");if(n){if(cur==1)renderDetails();if(!valid(cur))return;setStep(next());return}let p=e.target.closest("[data-prev]");if(p){setStep(prev());return}let j=e.target.closest("[data-step-target]");if(j){let target=Number(j.dataset.stepTarget);if(steps().includes(target)){let ok=true;for(let st of steps()){if(st==target)break;if(!valid(st,true)){ok=false;break}}if(ok)setStep(target)}}});
app.addEventListener("change",e=>{if(e.target.matches('input[name="main"]'))renderDetails();summary();state()});app.addEventListener("input",summary);
q("#form").addEventListener("submit",async e=>{
  e.preventDefault();
  if(submitting)return;
  hideSuccess();
  clear(5);
  if(!valid(5))return;

  submitting=true;
  let b=q("#submitBtn");
  b.disabled=true;
  b.textContent="Demo wird geprüft...";

  try{
    const payload=buildPayload();
    await sendDigitalPlusLead(payload, FORM_CONFIG);

    showSuccess(FORM_CONFIG.successText);
    /* Demo-Version: Eingaben bleiben zur Ansicht erhalten. */
    cur=1;
    renderDetails();
    summary();
    state();
  }catch(error){
    err(5,FORM_CONFIG.errorText);
  }finally{
    submitting=false;
    b.disabled=false;
    b.textContent="Demo absenden";
  }
});
renderDetails();summary();state();
})();


/* Digital Plus Demo Helper – Projektversion ohne Datenübertragung */
(function(){
  var DEFAULT_MESSAGE = 'Danke für den Versuch, dieses Formular abzuschicken. Dieses Formular ist eine Projekt- und Testversion. Die Versandfunktion ist deaktiviert. Es wurden keine Daten übertragen und keine E-Mails versendet.';
  window.DP_DEMO_MESSAGE = window.DP_DEMO_MESSAGE || DEFAULT_MESSAGE;
  window.showDigitalPlusDemoNotice = function(message){
    var text = message || window.DP_DEMO_MESSAGE || DEFAULT_MESSAGE;
    var modal = document.getElementById('dpDemoNoticeModal');
    if(!modal){
      modal = document.createElement('div');
      modal.id = 'dpDemoNoticeModal';
      modal.className = 'dp-demo-modal';
      modal.setAttribute('role','dialog');
      modal.setAttribute('aria-modal','true');
      modal.innerHTML = '<div class="dp-demo-card"><div class="dp-demo-head"><div class="dp-demo-icon" aria-hidden="true">ℹ</div><div><h3 class="dp-demo-title">Projektversion – kein Versand</h3></div></div><div class="dp-demo-body"><p data-demo-message></p><div class="dp-demo-note">Alle Auswahlfelder, Schritte und die Übersicht funktionieren weiterhin als Vorschau. Es wird jedoch kein Kontaktformular ausgelöst.</div><div class="dp-demo-actions"><button type="button" class="dp-demo-close">Verstanden</button></div></div></div>';
      document.body.appendChild(modal);
      modal.addEventListener('click', function(event){
        if(event.target === modal || event.target.closest('.dp-demo-close')){
          modal.classList.remove('is-open');
        }
      });
      document.addEventListener('keydown', function(event){
        if(event.key === 'Escape') modal.classList.remove('is-open');
      });
    }
    var messageBox = modal.querySelector('[data-demo-message]');
    if(messageBox) messageBox.textContent = text;
    modal.classList.add('is-open');
    var closeButton = modal.querySelector('.dp-demo-close');
    if(closeButton) closeButton.focus({preventScroll:true});
  };
})();

function sendDigitalPlusLead(payload, preferredConfig){
  var cfg = preferredConfig || (typeof CONFIG !== 'undefined' ? CONFIG : (typeof FORM_CONFIG !== 'undefined' ? FORM_CONFIG : {}));
  var text = (cfg && cfg.noMailMessage) || window.DP_DEMO_MESSAGE || 'Danke für den Versuch, dieses Formular abzuschicken. Dieses Formular ist eine Projekt- und Testversion. Die Versandfunktion ist deaktiviert. Es wurden keine Daten übertragen und keine E-Mails versendet.';
  if(typeof window.showDigitalPlusDemoNotice === 'function') window.showDigitalPlusDemoNotice(text);
  return Promise.resolve({success:true, demo:true, message:text});
}
