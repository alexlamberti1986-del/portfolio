<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Professionelle digitale Visitenkarte - Kita Wundersterne</title>
<style>
:root {
  --blue:#1677c9;
  --yellow:#ffd56a;
  --ink:#172033;
  --muted:#667085;
  --line:rgba(22,119,201,.14);
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body {
  font-family: Inter, Arial, Helvetica, sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 14% 14%, rgba(255,213,106,.42), transparent 28%),
    radial-gradient(circle at 82% 20%, rgba(22,119,201,.16), transparent 34%),
    radial-gradient(circle at 70% 88%, rgba(189,222,198,.28), transparent 36%),
    linear-gradient(135deg,#fffdf7,#f4faff 58%,#ffffff);
}
body:before {
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.32;
  background:
    linear-gradient(120deg, transparent 0 48%, rgba(255,213,106,.38) 49%, transparent 51% 100%),
    radial-gradient(circle at 4% 40%, rgba(255,213,106,.24), transparent 18%);
}
.page { width:min(1180px, 100%); margin:0 auto; padding:56px 22px 72px; position:relative; }
.hero { text-align:center; margin-bottom:34px; }
.kicker { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--blue); font-weight:900; margin-bottom:12px; }
h1 { margin:0; font-size:clamp(34px,5vw,68px); line-height:.96; letter-spacing:-.055em; }
h1 span { color:var(--blue); }
.lead { max-width:720px; margin:18px auto 0; color:var(--muted); font-size:18px; line-height:1.65; }
.accent { width:72px; height:4px; border-radius:99px; background:linear-gradient(90deg,var(--blue),var(--yellow)); margin:20px auto 0; }
.showcase {
  display:grid; grid-template-columns:repeat(2,minmax(260px,1fr)); gap:32px; align-items:start;
  margin:34px auto 72px;
}
.cardFrame {
  position:relative; border-radius:36px; padding:28px;
  background:rgba(255,255,255,.74); border:1px solid rgba(255,255,255,.86);
  box-shadow:0 26px 70px rgba(16,24,39,.11); backdrop-filter: blur(18px);
}
.label { font-size:13px; text-transform:uppercase; letter-spacing:.14em; color:var(--blue); font-weight:900; margin:0 0 16px; }
.fullCard {
  width:100%; height:auto; display:block; border-radius:24px;
  box-shadow:0 24px 64px rgba(16,24,39,.18); background:white;
}
.interactive {
  margin:0 auto; padding:42px 24px 50px; border-radius:42px;
  background:rgba(255,255,255,.64); border:1px solid rgba(255,255,255,.84);
  box-shadow:0 28px 80px rgba(16,24,39,.10); text-align:center; overflow:hidden;
}
.interactive h2 { margin:0 0 10px; font-size:clamp(28px,4vw,48px); letter-spacing:-.04em; }
.hint { margin:0 auto 30px; color:var(--muted); font-size:16px; }
.scene { height:min(64vh,570px); min-height:420px; display:grid; place-items:center; perspective:1400px; cursor:grab; user-select:none; touch-action:none; }
.scene:active { cursor:grabbing; }
.model {
  width:min(78vw,560px); aspect-ratio:670/434; position:relative; transform-style:preserve-3d;
  transform: rotateX(var(--rx, -8deg)) rotateY(var(--ry, -24deg));
  transition: transform .18s ease-out;
}
.face {
  position:absolute; inset:0; border-radius:26px; overflow:hidden; background:#fff;
  box-shadow:0 34px 80px rgba(16,24,39,.22); backface-visibility:hidden;
  border:1px solid rgba(255,255,255,.92);
}
.face img { width:100%; height:100%; object-fit:contain; display:block; background:#fff; }
.face.back { transform: rotateY(180deg) translateZ(2px); }
.face.front { transform: translateZ(2px); }
.edge {
  position:absolute; inset:0; border-radius:26px; transform:translateZ(-2px);
  background:linear-gradient(90deg,#e7edf3,#ffffff,#d8e2ea); box-shadow: inset 0 0 0 1px rgba(22,119,201,.10);
}
.shadow { width:min(76vw,540px); height:28px; border-radius:50%; background:rgba(16,24,39,.12); filter:blur(16px); transform:translateY(-34px); margin:0 auto; }
@media (max-width:760px) {
  .page { padding:38px 16px 54px; }
  .showcase { grid-template-columns:1fr; gap:24px; margin-bottom:48px; }
  .cardFrame { padding:18px; border-radius:28px; }
  .fullCard { border-radius:20px; }
  .scene { min-height:360px; height:52vh; }
  .model { width:min(90vw,520px); }
}
</style>
</head>

const scene = document.getElementById('scene');
const model = document.getElementById('model');
let dragging = false, startX = 0, startY = 0, rotX = -8, rotY = -24;
let auto = true;

  model.style.setProperty('--ry', rotY + 'deg');
}
scene.addEventListener('pointerdown', e => { dragging = true; auto = false; startX = e.clientX; startY = e.clientY; scene.setPointerCapture(e.pointerId); });
scene.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  startX = e.clientX; startY = e.clientY;
  rotY += dx * 0.45; rotX -= dy * 0.28;
  rotX = Math.max(-48, Math.min(48, rotX));
  paint();
});
scene.addEventListener('pointerup', () => { dragging = false; });
scene.addEventListener('pointercancel', () => { dragging = false; });
function loop() {
  if (auto) { rotY += 0.18; paint(); }
  requestAnimationFrame(loop);
}
paint(); loop();
</script>
</body>
