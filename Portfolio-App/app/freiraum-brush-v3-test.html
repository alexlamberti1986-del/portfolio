<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FREIRAUM Pinsel v3 — Lokaler Test</title>
  <link rel="stylesheet" href="assets/welten-world-switch-preview.css?v=20260629fr-brush-v4" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      color: #eef3ff;
      background: linear-gradient(160deg, #12051a, #1a0c22);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      max-width: 520px;
      padding: 28px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(10, 14, 24, 0.72);
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 1.45rem; }
    p { color: #b8c4df; line-height: 1.55; font-size: 0.92rem; }
    button {
      margin-top: 16px;
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #bc4dff, #ffc46a 48%, #ff57be);
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>FREIRAUM Pinsel v3</h1>
    <p>Breite Pinsel-Maske: 8 kubische Striche enthüllen das FREIRAUM-Gemälde (wie Broad-Brush-Prototyp).</p>
    <button type="button" id="playBtn">▶ Pinsel-Übergang testen</button>
  </div>
  <script src="assets/welten-world-switch-freiraum-brush-v3.js?v=20260701fr-broad-brush" defer></script>
  <script>
    document.getElementById("playBtn").addEventListener("click", function () {
      if (!window.__wwsFreiraumBrushV3) return;
      var overlay = document.createElement("div");
      overlay.className = "welten-world-switch wws-staged is-entering";
      overlay.setAttribute("data-world", "freiraum");
      overlay.innerHTML =
        '<div class="welten-world-switch__bg" aria-hidden="true"></div>' +
        '<div class="welten-world-switch__wipe" aria-hidden="true"></div>' +
        '<canvas class="welten-world-switch__canvas" aria-hidden="true"></canvas>' +
        '<div class="welten-world-switch__fx" aria-hidden="true"></div>' +
        '<div class="welten-world-switch__content">' +
        '<h2 class="welten-world-switch__title" data-text="FREIRAUM">FREIRAUM</h2>' +
        "</div>";
      document.body.appendChild(overlay);
      document.documentElement.classList.add("welten-world-switch-lock");
      overlay._wwsRevealTitleFn = function () {
        overlay.classList.add("wws--title-reveal");
      };
      window.__wwsFreiraumBrushV3(overlay);
      setTimeout(function () {
        overlay.classList.add("is-exiting");
        setTimeout(function () {
          overlay.remove();
          document.documentElement.classList.remove("welten-world-switch-lock");
        }, 500);
      }, 4800);
    });
  </script>
</body>
</html>
