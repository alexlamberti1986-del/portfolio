<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEIN UMZUG DEAL – Anfrageformular</title>
<style>
:root{
  --navy:#152336;
  --navy2:#24344A;
  --orange:#F4792B;
  --orange2:#E45F18;
  --red:#E63B39;
  --blue:#1B86C9;
  --green:#2EAD63;
  --bg:#F5F7FA;
  --line:#DDE5EE;
  --muted:#667085;
  --text:#101827;
  --white:#fff;
  --shadow:0 28px 72px rgba(21,35,54,.14);
  --shadow-sm:0 14px 34px rgba(21,35,54,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 8%,rgba(244,121,43,.16),transparent 30%),
    radial-gradient(circle at 92% 18%,rgba(27,134,201,.13),transparent 30%),
    linear-gradient(135deg,#fff 0%,#F3F6FA 52%,#fff 100%);
}
img{display:block;max-width:100%}
button,input,select,textarea{font-family:inherit}
.wrap{
  max-width:1500px;
  margin:0 auto;
  padding:28px 16px 50px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 390px;
  gap:28px;
  align-items:start;
}
.main{
  border-radius:34px;
  background:rgba(255,255,255,.97);
  border:1px solid rgba(21,35,54,.10);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.hero-head{
  padding:34px 42px 84px;
  color:#fff;
  background:
    linear-gradient(135deg,rgba(21,35,54,.94),rgba(36,52,74,.86)),
    url('https://images.unsplash.com/photo-1600518464441-9306b6659396?auto=format&fit=crop&w=1800&q=95') center/cover;
}
.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  flex-wrap:wrap;
  margin-bottom:32px;
}
.logo{
  height:108px;
  max-width:360px;
  object-fit:contain;
  background:transparent;
  border-radius:0;
  padding:0;
  box-shadow:none;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 17px;
  border-radius:999px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.22);
  font-weight:950;
  font-size:13px;
  backdrop-filter:blur(10px);
}
.badge:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange)}
h1{
  margin:0;
  max-width:980px;
  font-size:clamp(38px,5.4vw,76px);
  line-height:.95;
  letter-spacing:-.06em;
}
.sub{
  max-width:900px;
  margin:18px 0 0;
  color:rgba(255,255,255,.82);
  font-size:17px;
  line-height:1.75;
}
.progress{
  position:relative;
  z-index:2;
  margin:-54px 38px 28px;
  padding:20px;
  border-radius:28px;
  background:rgba(255,255,255,.97);
  border:1px solid rgba(21,35,54,.10);
  box-shadow:var(--shadow-sm);
}
.progress-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.progress-top strong{font-size:14px;color:var(--orange2)}
.progress-top span{font-size:13px;color:var(--muted);font-weight:900}
.steps{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:9px;
}
.step{
  border-radius:17px;
  background:#F6F8FB;
  border:1px solid transparent;
}
.step-btn{
  width:100%;
  min-height:74px;
  border:0;
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  cursor:pointer;
  color:inherit;
  padding:8px;
}
.circle{
  width:33px;height:33px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  background:#E5ECF2;color:var(--navy);font-weight:950;
}
.label{font-size:11px;font-weight:950;color:var(--navy);line-height:1.15;text-align:center}
.step.active,.step.done{background:linear-gradient(135deg,var(--navy),var(--navy2))}
.step.active .circle,.step.done .circle{background:var(--orange);color:#fff}
.step.active .label,.step.done .label{color:#fff}
.form-wrap{padding:0 38px 38px}
.card{
  min-height:720px;
  border-radius:32px;
  border:1px solid rgba(21,35,54,.10);
  background:#fff;
  box-shadow:0 22px 54px rgba(21,35,54,.08);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.panel{display:none;flex:1;padding:34px;flex-direction:column}
.panel.active{display:flex}
.kicker{
  display:inline-flex;
  width:max-content;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(244,121,43,.10);
  color:var(--orange2);
  font-size:12px;
  font-weight:950;
  text-transform:uppercase;
  letter-spacing:.09em;
  margin-bottom:14px;
}
h2{
  margin:0;
  font-size:clamp(28px,3vw,44px);
  line-height:1.08;
  color:var(--navy);
  letter-spacing:-.035em;
}
.desc{margin:12px 0 0;color:var(--muted);font-size:16px;line-height:1.7;max-width:920px}
.divider{height:1px;background:linear-gradient(90deg,rgba(21,35,54,.14),transparent);margin:26px 0}
.hero-card{
  display:grid;
  grid-template-columns:minmax(280px,42%) minmax(0,1fr);
  border-radius:30px;
  border:1px solid rgba(21,35,54,.10);
  overflow:hidden;
  background:#fff;
  box-shadow:var(--shadow-sm);
  margin-bottom:24px;
}
.hero-img{height:260px;background:#eaf0f5}
.hero-img img{width:100%;height:100%;object-fit:cover;image-rendering:auto;backface-visibility:hidden;transform:translateZ(0);filter:saturate(1.04) contrast(1.03)}
.hero-copy{
  padding:30px 34px;
  background:linear-gradient(135deg,#F7FAFD,#FFF2EA);
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.hero-copy h3{margin:0 0 10px;font-size:29px;line-height:1.1;color:var(--navy)}
.hero-copy p{margin:0;color:var(--muted);line-height:1.7}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
}
.option{position:relative}
.option input{position:absolute;opacity:0;pointer-events:none}
.option label{display:block;height:100%}
.option-card{
  position:relative;
  min-height:300px;
  height:100%;
  border-radius:26px;
  border:1px solid rgba(21,35,54,.10);
  overflow:hidden;
  background:#fff;
  box-shadow:0 14px 34px rgba(21,35,54,.08);
  cursor:pointer;
  transition:.2s;
}
.option-card:hover{transform:translateY(-3px);box-shadow:0 24px 52px rgba(21,35,54,.13)}
.option input:checked + label .option-card{
  border-color:rgba(244,121,43,.68);
  box-shadow:0 24px 58px rgba(244,121,43,.18);
}
.check{
  position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:999px;
  background:#fff;border:1px solid rgba(21,35,54,.14);box-shadow:0 8px 18px rgba(21,35,54,.12);z-index:3;
}
.option input:checked + label .check{background:var(--orange);border-color:transparent}
.option input:checked + label .check:after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:950}
.option-img{height:145px;background:#edf2f6}
.option-img img{width:100%;height:100%;object-fit:cover;image-rendering:auto;backface-visibility:hidden;transform:translateZ(0);filter:saturate(1.04) contrast(1.03)}
.option-body{padding:18px;display:flex;flex-direction:column;gap:9px}
.option-tag{width:max-content;border-radius:999px;padding:6px 10px;background:#F2F4F7;color:var(--orange2);font-size:12px;font-weight:950}
.option-title{margin:0;color:var(--navy);font-size:19px;line-height:1.15;font-weight:950}
.option-sub{color:var(--muted);font-size:14px;line-height:1.55}
.price-line{margin-top:auto;padding-top:8px;color:var(--green);font-weight:950;font-size:14px}
.chip-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip label{
  min-height:72px;
  display:flex;
  gap:12px;
  align-items:center;
  padding:16px 18px;
  border-radius:20px;
  border:1px solid rgba(21,35,54,.10);
  background:#F8FAFC;
  color:var(--navy);
  font-weight:850;
  cursor:pointer;
  transition:.18s;
}
.chip label:before{
  content:"";
  width:18px;height:18px;border-radius:999px;border:2px solid #C8D2D9;background:#fff;flex-shrink:0;
}
.chip input:checked + label{border-color:rgba(244,121,43,.58);background:rgba(244,121,43,.08);color:var(--orange2)}
.chip input:checked + label:before{background:radial-gradient(circle at center,#fff 0 28%,var(--orange) 31% 100%);border-color:var(--orange)}
.fields,.select-stack{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}
.field label{display:block;margin:0 0 10px;font-size:14px;font-weight:900;color:var(--navy)}
.req{color:var(--orange2)}
.input,.select,.textarea{
  width:100%;
  min-height:56px;
  border:1px solid rgba(21,35,54,.14);
  border-radius:16px;
  padding:15px 17px;
  background:#fff;
  color:var(--text);
  font-size:15px;
  outline:none;
}
.textarea{min-height:128px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:rgba(244,121,43,.65);box-shadow:0 0 0 5px rgba(244,121,43,.10)}
.full{grid-column:1/-1}
.cost-box{
  border:1px solid rgba(46,173,99,.22);
  border-radius:26px;
  padding:20px;
  background:linear-gradient(135deg,rgba(46,173,99,.08),rgba(244,121,43,.06));
  color:var(--navy);
}
.cost-box strong{display:block;font-size:20px;margin-bottom:8px;color:var(--green)}
.pay-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.twint-box{
  display:none;
  margin-top:20px;
  border-radius:28px;
  border:1px dashed rgba(21,35,54,.22);
  background:#fff;
  padding:22px;
  text-align:center;
}
.twint-box.show{display:block}
.qr{
  width:190px;height:190px;margin:0 auto 14px;border-radius:18px;
  background:
    linear-gradient(90deg,#111 10px,transparent 10px) 0 0/20px 20px,
    linear-gradient(#111 10px,transparent 10px) 0 0/20px 20px,
    #fff;
  border:14px solid #fff;
  box-shadow:0 12px 28px rgba(21,35,54,.14);
}
.side{
  position:sticky;
  top:24px;
  border-radius:34px;
  padding:26px;
  color:#fff;
  background:
    radial-gradient(circle at 90% 10%,rgba(244,121,43,.28),transparent 28%),
    linear-gradient(155deg,var(--navy),var(--navy2) 62%,#101925);
  box-shadow:var(--shadow);
}
.summary-title{margin:0 0 8px;font-size:25px;font-weight:950}
.summary-sub{margin:0 0 22px;color:rgba(255,255,255,.68);font-size:14px;line-height:1.65}
.summary-box{border-radius:24px;padding:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10)}
.summary-row{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.10)}
.summary-row:last-child{border-bottom:0}
.summary-label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.52);font-weight:900}
.summary-value{font-size:14px;line-height:1.6;font-weight:760;word-break:break-word}
.total-box{
  margin-top:18px;
  border-radius:26px;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  padding:20px;
  box-shadow:0 18px 38px rgba(244,121,43,.24);
}
.total-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;opacity:.78}
.total-value{font-size:38px;line-height:1;font-weight:950;margin-top:8px}
.total-note{font-size:12px;line-height:1.5;opacity:.82;margin-top:10px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:auto;padding-top:28px}
.btn{
  appearance:none;
  border:0;
  min-height:56px;
  padding:0 24px;
  border-radius:999px;
  font-size:15px;
  font-weight:950;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:.18s;
}
.btn.primary,.btn.dark{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;box-shadow:0 16px 30px rgba(244,121,43,.24)}
.btn.secondary{background:#fff;color:var(--navy);border:1px solid rgba(21,35,54,.14);box-shadow:var(--shadow-sm)}
.error{display:none;margin-top:14px;padding:14px 16px;border-radius:16px;background:rgba(244,121,43,.09);color:var(--orange2);border:1px solid rgba(244,121,43,.18);font-weight:850;font-size:14px}
.error.show{display:block}
.mobile-summary{display:none}
.small-muted{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}

.success{
  display:none;
  margin-top:14px;
  padding:14px 16px;
  border-radius:16px;
  background:rgba(46,173,99,.10);
  color:var(--green);
  border:1px solid rgba(46,173,99,.24);
  font-weight:850;
  font-size:14px;
}
.success.show{display:block}

@media(max-width:1320px){
  .wrap{grid-template-columns:1fr}
  .side{display:none}
  .mobile-summary{display:block;margin-top:18px}
  .mobile-summary .side{display:block;position:static}
}
@media(max-width:1080px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-card{grid-template-columns:1fr}
  .hero-img{height:220px}
  .pay-grid{grid-template-columns:1fr}
}
@media(max-width:780px){
  .wrap{padding:12px 8px 28px}
  .hero-head{padding:24px 18px 70px}
  .logo{height:82px;max-width:260px}
  .progress{margin:-46px 18px 20px;padding:14px;border-radius:22px}
  .steps{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .step-btn{min-height:64px}
  .form-wrap{padding:0 18px 18px}
  .card{border-radius:24px;min-height:auto}
  .panel{padding:20px}
  .grid,.chip-grid,.fields,.select-stack{grid-template-columns:1fr}
  .actions{flex-direction:column}
  .btn{width:100%}
}

/* Angepasste Bildauswahl nach Kundenwunsch */
.option-img img,
.hero-img img{
  object-fit:cover !important;
  object-position:center center !important;
}
.option input[id="svc_raeumung"] + label .option-img img{
  object-position:center center !important;
}
.option input[id="svc_transporter"] + label .option-img img{
  object-position:center center !important;
}
.option input[id="svc_transporter-helfer"] + label .option-img img,
.option input[id="svc_komplett"] + label .option-img img{
  object-position:center center !important;
}


/* Kundenbilder – optimierte Bildpositionen */
.option input[id="svc_transporter"] + label .option-img img{object-position:center center !important;}
.option input[id="svc_helfer"] + label .option-img img{object-position:center center !important;}
.option input[id="svc_transporter-helfer"] + label .option-img img{object-position:center center !important;}
.option input[id="svc_transporter-fahrer"] + label .option-img img{object-position:center center !important;}
.option input[id="svc_komplett"] + label .option-img img{object-position:center center !important;}
.option input[id="svc_raeumung"] + label .option-img img{object-position:center center !important;}


/* =========================================================
   DEIN UMZUG DEAL Formular Schutz CSS
   Wichtig für Einbau auf jeder Webseite:
   schützt das Formular vor fremdem Theme-, Builder- oder globalem CSS.
   ========================================================= */
#dealApp,
#dealApp * {
  box-sizing: border-box !important;
}

#dealApp {
  width: 100% !important;
  max-width: 100% !important;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
  color: var(--text) !important;
  line-height: normal !important;
}

#dealApp img {
  max-width: 100% !important;
  height: auto !important;
  display: block !important;
  border: 0 !important;
}

#dealApp .wrap {
  max-width: 1540px !important;
  margin: 0 auto !important;
  padding: 22px 16px 42px !important;
  display: grid !important;
  grid-template-columns: minmax(0,1fr) 370px !important;
  gap: 24px !important;
  align-items: start !important;
}

#dealApp .main,
#dealApp .side {
  border-radius: 30px !important;
  box-shadow: var(--shadow) !important;
}

#dealApp .main {
  background: rgba(255,255,255,.98) !important;
  padding: 30px !important;
  border: 1px solid rgba(255,122,0,.18) !important;
}

#dealApp .side {
  position: sticky !important;
  top: 24px !important;
  padding: 26px !important;
  overflow: hidden !important;
}

#dealApp .brand,
#dealApp .brand-left {
  display: flex !important;
  align-items: center !important;
  gap: 16px !important;
  flex-wrap: wrap !important;
}

#dealApp .logo,
#dealApp .logo-card {
  width: auto !important;
  min-width: 0 !important;
  max-width: 300px !important;
  min-height: 76px !important;
  object-fit: contain !important;
  background: transparent !important;
  border-radius: 0 !important;
  padding: 0 !important;
  box-shadow: none !important;
}

#dealApp .badge {
  display: inline-flex !important;
  align-items: center !important;
  gap: 10px !important;
  padding: 10px 16px !important;
  border-radius: 999px !important;
  font-size: 13px !important;
  font-weight: 900 !important;
  line-height: 1 !important;
  text-decoration: none !important;
}

#dealApp .progress {
  margin: 26px 0 24px !important;
  background: #ffffff !important;
  border: 1px solid var(--line) !important;
  border-radius: 26px !important;
  padding: 22px !important;
  box-shadow: var(--shadow-sm) !important;
}

#dealApp .steps {
  display: grid !important;
  grid-template-columns: repeat(7,minmax(0,1fr)) !important;
  gap: 8px !important;
  position: relative !important;
}

#dealApp .step {
  position: relative !important;
  z-index: 1 !important;
  text-align: center !important;
  display: block !important;
}

#dealApp .step-btn,
#dealApp .step-btn:hover,
#dealApp .step-btn:focus,
#dealApp .step-btn:active {
  appearance: none !important;
  -webkit-appearance: none !important;
  border: 0 !important;
  background: transparent !important;
  padding: 0 !important;
  margin: 0 !important;
  width: 100% !important;
  color: inherit !important;
  cursor: pointer !important;
  text-decoration: none !important;
  box-shadow: none !important;
  outline: none !important;
  transform: none !important;
}

#dealApp .circle {
  width: 44px !important;
  height: 44px !important;
  min-width: 44px !important;
  min-height: 44px !important;
  max-width: 44px !important;
  max-height: 44px !important;
  margin: 0 auto 10px !important;
  border-radius: 999px !important;
  font-size: 15px !important;
  font-weight: 900 !important;
  line-height: 44px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  box-shadow: 0 0 0 8px rgba(255,255,255,.96) !important;
  transition: .2s !important;
  transform: none !important;
}

#dealApp .label {
  font-size: 12px !important;
  font-weight: 800 !important;
  line-height: 1.25 !important;
  transition: .2s !important;
}

#dealApp .card {
  background: #ffffff !important;
  border-radius: 30px !important;
  padding: 32px !important;
  min-height: 780px !important;
  display: flex !important;
  flex-direction: column !important;
}

#dealApp .panel {
  display: none !important;
  flex: 1 !important;
  flex-direction: column !important;
}

#dealApp .panel.active {
  display: flex !important;
}

#dealApp .grid,
#dealApp .chip-grid,
#dealApp .fields,
#dealApp .select-stack,
#dealApp .question-grid,
#dealApp .mini-grid {
  display: grid !important;
  gap: 18px !important;
}

#dealApp .option,
#dealApp .chip,
#dealApp .radio-card {
  position: relative !important;
}

#dealApp .option input,
#dealApp .chip input,
#dealApp .radio-card input {
  position: absolute !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

#dealApp .option label,
#dealApp .chip label,
#dealApp .radio-card label {
  cursor: pointer !important;
  text-decoration: none !important;
}

#dealApp .option-card,
#dealApp .mini-card,
#dealApp .question-box,
#dealApp .info-box {
  border-radius: 22px !important;
}

#dealApp .option-img,
#dealApp .hero-img,
#dealApp .mini-top,
#dealApp .chip-img {
  overflow: hidden !important;
}

#dealApp .option-img img,
#dealApp .hero-img img,
#dealApp .mini-top img,
#dealApp .chip-img img {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  image-rendering: auto !important;
  backface-visibility: hidden !important;
  transform: translateZ(0) !important;
}

#dealApp .btn,
#dealApp button,
#dealApp input,
#dealApp select,
#dealApp textarea {

  function clear(step){const b=q(`[data-error-step="${step}"]`);if(b){b.textContent="";b.classList.remove("show")}}
  function err(step,msg){const b=q(`[data-error-step="${step}"]`);if(b){b.textContent=msg;b.classList.add("show")}}
  function validate(step,silent=false){if(!silent)clear(step);const fail=m=>{if(!silent)err(step,m);return false};if(step===1&&!radio("job_type"))return fail("Bitte wählen Sie privat oder geschäftlich aus.");if(step===2&&checked("services").length<1)return fail("Bitte wählen Sie mindestens eine Dienstleistung aus.");if(step===3&&checked("transport").length<1)return fail("Bitte wählen Sie mindestens eine Transportart aus.");if(step===4&&!radio("move_size"))return fail("Bitte wählen Sie den Umzugsumfang aus.");if(step===5){if(!val("#firstName")||!val("#lastName"))return fail("Bitte geben Sie Vorname und Nachname ein.");if(!val("#phone"))return fail("Bitte geben Sie eine Telefonnummer ein.");if(!/^\S+@\S+\.\S+$/.test(val("#email")))return fail("Bitte geben Sie eine gültige E-Mail-Adresse ein.");if(!val("#fromAddress")||!val("#toAddress"))return fail("Bitte geben Sie aktuelle und neue Adresse ein.");}if(step===6&&!radio("payment"))return fail("Bitte wählen Sie eine Zahlungsmethode aus.");return true}
  function setStep(step){current=Math.max(1,Math.min(total,step));qa(".panel").forEach(p=>p.classList.toggle("active",Number(p.dataset.step)===current));q("#stepText").textContent=`Schritt ${current} von ${total}`;q("#stepLabel").textContent=STEP_META[current][1];clear(current);update();state();window.scrollTo({top:app.offsetTop-20,behavior:"smooth"})}
  function state(){qa("[data-step-node]").forEach(n=>{const st=Number(n.dataset.stepNode);n.classList.remove("active","done");if(st===current)n.classList.add("active");if(st<current)n.classList.add("done")})}
  function update(){
    const total=totalPrice();
    q("#liveServices")&&(q("#liveServices").textContent=money(servicePrice()));
    q("#sumJob").textContent=radio("job_type")||"Noch keine Auswahl";
    q("#sumServices").textContent=(checked("services").join(", ")||"Noch keine Auswahl") + (checked("services").length?` / Dauer: ${val("#duration")}`:"");
    q("#sumTransport").textContent=checked("transport").join(", ")||"Noch keine Auswahl";
    q("#sumNotes")&&(q("#sumNotes").textContent=val("#transportNotes")||val("#parkingInfo")||"Noch keine Angaben");
    q("#sumSize").textContent=radio("move_size")||"Noch keine Auswahl";
    q("#sumContact").textContent=[[val("#company")],[val("#firstName"),val("#lastName")].filter(Boolean).join(" "),val("#phone"),val("#email")].flat().filter(Boolean).join(" / ")||"Noch keine Angaben";
    q("#sumPayment").textContent=radio("payment")||"Noch keine Auswahl";
    q("#sumTotal").textContent=money(total);
    q("#finalTotal")&&(q("#finalTotal").textContent=money(total));
    q("#finalText")&&(q("#finalText").textContent=`Gewählte Zahlungsart: ${radio("payment")||"noch offen"}. Richtpreis kann nach Detailprüfung angepasst werden.`);
    const tw=q("#twintBox"); if(tw)tw.classList.toggle("show",radio("payment")==="TWINT QR-Code");
    renderMobile();
  }
  function renderMobile(){const box=q(".mobile-summary");if(!box||window.innerWidth>1320){if(box)box.innerHTML="";return}box.innerHTML=`<aside class="side" style="position:static"><h3 class="summary-title">Ihre Übersicht</h3><p class="summary-sub">Auswahl und Kosten werden live berechnet.</p><div class="summary-box">${qa(".summary-box .summary-row").map(r=>r.outerHTML).join("")}</div><div class="total-box"><div class="total-label">Aktuelles Total</div><div class="total-value">${money(totalPrice())}</div><div class="total-note">Richtpreis inkl. gewählter Zusatzleistungen.</div></div></aside>`}
  app.addEventListener("click",e=>{const n=e.target.closest("[data-next]");if(n){if(!validate(current))return;setStep(current+1);return}const p=e.target.closest("[data-prev]");if(p){setStep(current-1);return}const j=e.target.closest("[data-step-target]");if(j){const target=Number(j.dataset.stepTarget);let ok=true;for(let s=1;s<target;s++){if(!validate(s,true)){ok=false;break}}if(ok)setStep(target)}});
  app.addEventListener("change",update);app.addEventListener("input",update);
  function buildSummary(){
    return [
      `Auftrag: ${radio("job_type")||"-"}`,
      `Leistungen: ${checked("services").join(", ")||"-"}`,
      `Einsatzdauer: ${val("#duration")||"-"}`,
      `Transportdetails: ${checked("transport").join(", ")||"-"}`,
      `Zusätzliche Transportangaben: ${val("#transportNotes")||"-"}`,
      `Umfang: ${radio("move_size")||"-"}`,
      `Firma: ${val("#company")||"-"}`,
      `Vorname: ${val("#firstName")||"-"}`,
      `Nachname: ${val("#lastName")||"-"}`,
      `Telefon: ${val("#phone")||"-"}`,
      `E-Mail: ${val("#email")||"-"}`,
      `Gewünschter Zeitpunkt: ${val("#when")||"-"}`,
      `Fixes Umzugsdatum: ${val("#preferredDate")||"-"}`,
      `Aktuelle Adresse: ${[val("#fromAddress"),val("#fromFloor"),val("#fromLift")].filter(Boolean).join(" / ")||"-"}`,
      `Neue Adresse: ${[val("#toAddress"),val("#toFloor"),val("#toLift")].filter(Boolean).join(" / ")||"-"}`,
      `Parkierung / Haltezone: ${val("#parkingInfo")||"-"}`,
      `Bilder / Dokumente Link: ${val("#fileLink")||"-"}`,
      `Zahlungsmethode: ${radio("payment")||"-"}`,
      `Bemerkungen: ${val("#message")||"-"}`,
      `Richttotal: ${money(totalPrice())}`
    ].join("\\n");
  }
  function firstInvalidStep(){
    for(let s=1;s<=6;s++){if(!validate(s,true))return s}
    return 0;
  }
  function showSubmitMessage(type,msg){
    const success=q("#formSuccess");
    const errorBox=q(`[data-error-step="7"]`);
    if(success){success.textContent="";success.classList.remove("show");}
    if(errorBox){errorBox.textContent="";errorBox.classList.remove("show");}
    if(type==="success"&&success){success.textContent=msg;success.classList.add("show");}
    if(type==="error"&&errorBox){errorBox.textContent=msg;errorBox.classList.add("show");}
  }
  q("#leadForm").addEventListener("submit",async e=>{
    e.preventDefault();
    if(submitting)return;
    const invalid=firstInvalidStep();
    if(invalid){setStep(invalid);validate(invalid);return;}
    submitting=true;
    const b=q("#submitBtn");
    b.disabled=true;
    b.textContent="Demo wird geprüft...";
    showSubmitMessage("","");

    const services=checked("services");
    const transport=checked("transport");
    const locationText=[val("#fromAddress"),val("#toAddress")].filter(Boolean).join(" → ");
    const payload={
      client_id:CONFIG.clientId,
      company_name:CONFIG.companyName,
      form_type:CONFIG.formType,
      kundentyp:radio("job_type"),
      customer_type:radio("job_type"),
      service:services.join("\n"),
      reinigung:services.join("\n"),
      services:services.join("\n"),
      paket:radio("move_size"),
      package:radio("move_size"),
      // Keine doppelte Transport-Zeile als allgemeines Details-Feld senden – transport_details enthält die saubere Angabe.
      details:'',
      // Keine Sammel-Extras senden: Einsatzdauer, Transport, Zahlung, Parkierung und Dateien stehen bereits als eigene Mail-Felder.
      extras:"",
      standort:locationText,
      location:locationText,
      plz_ort:locationText,
      city:locationText,
      vehicle:"",
      firma:val("#company"),
      company:val("#company"),
      vorname:val("#firstName"),
      first_name:val("#firstName"),
      nachname:val("#lastName"),
      last_name:val("#lastName"),
      telefon:val("#phone"),
      phone:val("#phone"),
      email:val("#email"),
      desired_time:val("#when"),
      preferred_date:val("#preferredDate"),
      strasse_nr:val("#fromAddress"),
      street:val("#fromAddress"),
      from_address:val("#fromAddress"),
      from_floor:val("#fromFloor"),
      from_lift:val("#fromLift"),
      to_address:val("#toAddress"),
      to_floor:val("#toFloor"),
      to_lift:val("#toLift"),
      transport_details:transport.join("\n"),
      transport_notes:val("#transportNotes"),
      parking_info:val("#parkingInfo"),
      file_link:val("#fileLink"),
      payment:radio("payment"),
      subtotal:String(servicePrice()||""),
      estimated_total:String(totalPrice()||""),
      nachricht:val("#message"),
      message:val("#message"),
      zusammenfassung:buildSummary(),
      website:val("#websiteField")
    };

    try{
      await sendDigitalPlusLead(payload, CONFIG);
      showSubmitMessage("success",CONFIG.successText||"Ihre Anfrage wurde erfolgreich übermittelt.");
    }catch(error){
      showSubmitMessage("error",CONFIG.errorText||"Beim Senden ist etwas schiefgelaufen. Bitte versuchen Sie es nochmals.");
    }finally{
      submitting=false;
      b.disabled=false;
      b.textContent="Demo absenden";
    }
  });
  update();state();
})();

/* Digital Plus Demo Helper – Projektversion ohne Datenübertragung */
(function(){
  var DEFAULT_MESSAGE = 'Danke für den Versuch, dieses Formular abzuschicken. Dieses Formular ist eine Projekt- und Testversion. Die Versandfunktion ist deaktiviert. Es wurden keine Daten übertragen und keine E-Mails versendet.';
  window.DP_DEMO_MESSAGE = window.DP_DEMO_MESSAGE || DEFAULT_MESSAGE;
  window.showDigitalPlusDemoNotice = function(message){
    var text = message || window.DP_DEMO_MESSAGE || DEFAULT_MESSAGE;
    var modal = document.getElementById('dpDemoNoticeModal');
    if(!modal){
      modal = document.createElement('div');
      modal.id = 'dpDemoNoticeModal';
      modal.className = 'dp-demo-modal';
      modal.setAttribute('role','dialog');
      modal.setAttribute('aria-modal','true');
      modal.innerHTML = '<div class="dp-demo-card"><div class="dp-demo-head"><div class="dp-demo-icon" aria-hidden="true">ℹ</div><div><h3 class="dp-demo-title">Projektversion – kein Versand</h3></div></div><div class="dp-demo-body"><p data-demo-message></p><div class="dp-demo-note">Alle Auswahlfelder, Schritte und die Übersicht funktionieren weiterhin als Vorschau. Es wird jedoch kein Kontaktformular ausgelöst.</div><div class="dp-demo-actions"><button type="button" class="dp-demo-close">Verstanden</button></div></div></div>';
      document.body.appendChild(modal);
      modal.addEventListener('click', function(event){
        if(event.target === modal || event.target.closest('.dp-demo-close')){
          modal.classList.remove('is-open');
        }
      });
      document.addEventListener('keydown', function(event){
        if(event.key === 'Escape') modal.classList.remove('is-open');
      });
    }
    var messageBox = modal.querySelector('[data-demo-message]');
    if(messageBox) messageBox.textContent = text;
    modal.classList.add('is-open');
    var closeButton = modal.querySelector('.dp-demo-close');
    if(closeButton) closeButton.focus({preventScroll:true});
  };
})();

function sendDigitalPlusLead(payload, preferredConfig){
  var cfg = preferredConfig || (typeof CONFIG !== 'undefined' ? CONFIG : (typeof FORM_CONFIG !== 'undefined' ? FORM_CONFIG : {}));
  var text = (cfg && cfg.noMailMessage) || window.DP_DEMO_MESSAGE || 'Danke für den Versuch, dieses Formular abzuschicken. Dieses Formular ist eine Projekt- und Testversion. Die Versandfunktion ist deaktiviert. Es wurden keine Daten übertragen und keine E-Mails versendet.';
  if(typeof window.showDigitalPlusDemoNotice === 'function') window.showDigitalPlusDemoNotice(text);
  return Promise.resolve({success:true, demo:true, message:text});
}
