/* =========================================================
   DT-Cleaning Formular Schutz CSS
   Wichtig für Einbau auf jeder Webseite:
   schützt das Formular vor fremdem Theme-, Builder- oder globalem CSS.
   ========================================================= */
#dtLeadApp,
#dtLeadApp * {
  box-sizing: border-box !important;
}

#dtLeadApp {
  width: 100% !important;
  max-width: 100% !important;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
  color: var(--text) !important;
  line-height: normal !important;
}

#dtLeadApp img {
  max-width: 100% !important;
  height: auto !important;
  display: block !important;
  border: 0 !important;
}

#dtLeadApp .wrap {
  max-width: 1540px !important;
  margin: 0 auto !important;
  padding: 22px 16px 42px !important;
  display: grid !important;
  grid-template-columns: minmax(0,1fr) 370px !important;
  gap: 24px !important;
  align-items: start !important;
}

#dtLeadApp .main,
#dtLeadApp .side {
  border-radius: 30px !important;
  box-shadow: var(--shadow) !important;
}

#dtLeadApp .main {
  background: rgba(255,255,255,.98) !important;
  padding: 30px !important;
  border: 1px solid rgba(220,232,242,.96) !important;
}

#dtLeadApp .side {
  position: sticky !important;
  top: 24px !important;
  padding: 26px !important;
  overflow: hidden !important;
}

#dtLeadApp .brand,
#dtLeadApp .brand-left {
  display: flex !important;
}

#dtLeadApp .brand {
  align-items: flex-start !important;
  justify-content: space-between !important;
  gap: 20px !important;
  flex-wrap: wrap !important;
  margin-bottom: 22px !important;
}

#dtLeadApp .brand-left {
  align-items: center !important;
  gap: 16px !important;
  flex-wrap: wrap !important;
}

#dtLeadApp .logo-card {
  height: 84px !important;
  min-width: 220px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  background: #ffffff !important;
  border-radius: 18px !important;
  padding: 12px 18px !important;
  box-shadow: 0 10px 22px rgba(18,32,51,.08) !important;
  font-weight: 950 !important;
  font-size: 27px !important;
  color: var(--primary-dark) !important;
  letter-spacing: -.03em !important;
}

#dtLeadApp .badge {
  display: inline-flex !important;
  align-items: center !important;
  gap: 10px !important;
  padding: 10px 16px !important;
  border-radius: 999px !important;
  background: rgba(21,131,220,.12) !important;
  color: var(--primary-dark) !important;
  font-size: 13px !important;
  font-weight: 900 !important;
  line-height: 1 !important;
  text-decoration: none !important;
}

#dtLeadApp .progress {
  margin: 26px 0 24px !important;
  background: #ffffff !important;
  border: 1px solid var(--line) !important;
  border-radius: 26px !important;
  padding: 22px !important;
  box-shadow: var(--shadow-sm) !important;
}

#dtLeadApp .steps {
  display: grid !important;
  grid-template-columns: repeat(7,minmax(0,1fr)) !important;
  gap: 8px !important;
  position: relative !important;
}

#dtLeadApp .step {
  position: relative !important;
  z-index: 1 !important;
  text-align: center !important;
  display: block !important;
}

#dtLeadApp .step-btn,
#dtLeadApp .step-btn:hover,
#dtLeadApp .step-btn:focus,
#dtLeadApp .step-btn:active {
  appearance: none !important;
  -webkit-appearance: none !important;
  border: 0 !important;
  background: transparent !important;
  padding: 0 !important;
  margin: 0 !important;
  width: 100% !important;
  color: inherit !important;
  cursor: pointer !important;
  text-decoration: none !important;
  box-shadow: none !important;
  outline: none !important;
  transform: none !important;
}

#dtLeadApp .circle {
  width: 44px !important;
  height: 44px !important;
  min-width: 44px !important;
  min-height: 44px !important;
  max-width: 44px !important;
  max-height: 44px !important;
  margin: 0 auto 10px !important;
  border-radius: 999px !important;
  font-size: 15px !important;
  font-weight: 900 !important;
  line-height: 44px !important;
  display: flex !important;

  function togglePaymentOptions(){const business=radio('kundentyp')==='Geschäftskunde';const invoiceOption=q('#invoicePaymentOption');const invoiceInfo=q('#invoiceInfo');if(invoiceOption)invoiceOption.classList.toggle('hidden',!business);if(!business&&radio('payment_method')==='Rechnung'){const card=q('#pay_card');if(card)card.checked=true;}const isInvoice=paymentMethod()==='Rechnung';const cardPreview=q('#cardPreview');if(cardPreview)cardPreview.classList.toggle('hidden',isInvoice);if(invoiceInfo)invoiceInfo.classList.toggle('hidden',!business||!isInvoice);updatePaymentAmount();}
  function updatePaymentAmount(){const el=q('#paymentAmount');if(el)el.textContent='Betrag: ab '+money(estimatePrice().total);}
  function buildSummary(){const price=estimatePrice();const s=service();const p=pkg();const location=selectedLocation();const logic=locationLogic();const serviceName=s?.title||'-';const packageName=p?.title||'-';const extras=selectedExtras().map(e=>`${e.title} (${e.priceLabel})`).join(', ')||'-';const lines=[`Kundentyp: ${radio('kundentyp')||'-'}`,`Reinigung: ${serviceName}`,`Paket: ${packageName}`,`Standort-Logik: ${logic.rule} – ${logic.reason}`,`Mögliche Standorte: ${logic.ids.map(id=>byId(CONFIG.locations,id)?.title).filter(Boolean).join(', ')}`,`Fahrzeugtyp: ${vehicleTypeLabel()}`,`Extras: ${extras}`,`Standort: ${val('#standort')||'-'}`,`Standort Adresse: ${location?.address||'-'}`,`Direkter Buchungslink: ${location?.bookingUrl||'-'}`,`Wunschtermin: ${val('#appointmentDate')||'-'} ${val('#appointmentTime')||''}`,`Fahrzeug / Modell: ${val('#vehicleModel')||'-'}`,`Richtpreis: ab ${money(price.total)}`,`Zahlungsart: ${paymentMethod()}`,`Firma: ${val('#company')||'-'}`,`Vorname: ${val('#first')||'-'}`,`Nachname: ${val('#last')||'-'}`,`E-Mail: ${val('#mail')||'-'}`,`Telefon: ${val('#phone')||'-'}`,`Strasse / Nr.: ${val('#street')||'-'}`,`PLZ / Ort: ${val('#city')||'-'}`,`Nachricht: ${val('#msg')||'-'}`];return lines.join('\n');}
  function updatePrice(){const price=estimatePrice();q('#sumPrice').textContent='ab '+money(price.total);q('#lineItems').innerHTML=(price.items.length?price.items:[{title:'Noch keine Auswahl',detail:'Bitte Paket wählen',amount:0}]).map(i=>`<div class="line-item"><div><b>${esc(i.title)}</b><small>${esc(i.detail||'')}</small></div><strong>ab ${money(i.amount)}</strong></div>`).join('');return price;}
  function updateSummary(){const price=updatePrice();const s=service();const p=pkg();q('#sumCustomer').textContent=radio('kundentyp')||'Noch keine Auswahl';q('#sumService').textContent=[s?.title,p?.title].filter(Boolean).join(' / ')||'Noch keine Auswahl';q('#sumExtras').textContent=selectedExtras().map(e=>e.title).join(', ')||'Keine Auswahl';q('#sumLocation').textContent=[val('#standort'),val('#appointmentDate'),val('#appointmentTime')].filter(Boolean).join(' / ')||'Noch keine Auswahl';q('#sumVehicle').textContent=[vehicleTypeLabel(),val('#vehicleModel')].filter(Boolean).join(' / ')||'Noch keine Angabe';q('#sumContact').textContent=[[val('#company')],[val('#first'),val('#last')].filter(Boolean).join(' '),val('#mail')].flat().filter(Boolean).join(' / ')||'Noch keine Angaben';const sp=q('#sumPayment');if(sp)sp.textContent=paymentMethod();updatePaymentAmount();updateBookingHint();renderMobile();}
  function renderMobile(){const box=q('.mobile-summary');if(!box||window.innerWidth>1350){if(box)box.innerHTML='';return;}box.innerHTML=`<div class="side" style="position:static;display:block;color:var(--text);background:#fff"><h3 class="summary-title" style="color:var(--navy)">Ihre Übersicht</h3><p class="summary-sub" style="color:var(--muted)">Alle Angaben und der Richtpreis werden live zusammengefasst.</p><div class="summary-box" style="background:#f8fbff;border-color:var(--line)">${qa('.summary-box .summary-row').map(r=>r.outerHTML).join('')}</div><div class="summary-price"><div class="summary-label" style="color:var(--muted)">Gesamt-Richtpreis</div><strong style="color:var(--navy)">${q('#sumPrice').textContent}</strong><div class="line-items">${q('#lineItems').innerHTML}</div></div></div>`;}
  function getMaxAllowedStep(){let max=1;for(let step=1;step<=total;step++){if(validate(step,true)){max=Math.min(step+1,total);}else{max=step;break;}}return max;}
  function updateStepStates(){const maxAllowed=getMaxAllowedStep();qa('[data-step-node]').forEach(node=>{const step=Number(node.dataset.stepNode);node.classList.remove('active','done','available','locked');if(step<current)node.classList.add('done');if(step===current)node.classList.add('active');if(step<=maxAllowed)node.classList.add('available');else node.classList.add('locked');const btn=node.querySelector('.step-btn');if(btn)btn.disabled=step>maxAllowed;});}
  function setStep(n){current=Math.max(1,Math.min(total,n));if(current===3)renderPackages();if(current===4)renderExtras();if(current===5){renderLocations();updateTimeSlots();}qa('.panel').forEach(p=>p.classList.toggle('active',Number(p.dataset.step)===current));q('#stepText').textContent=`Schritt ${current} von ${total}`;q('#stepLabel').textContent=CONFIG.stepLabels[current]||'';clearError(current);updateSummary();updateStepStates();window.scrollTo({top:app.offsetTop-20,behavior:'smooth'});}
  function validate(step,silent=false){if(!silent)clearError(step);const fail=(s,m)=>{if(!silent)setError(s,m);return false;};if(step===1&&!radio('kundentyp'))return fail(1,'Bitte wählen Sie Privatkunde oder Geschäftskunde.');if(step===2&&!serviceId())return fail(2,'Bitte wählen Sie eine Reinigungsart.');if(step===3&&!radio('paket_id'))return fail(3,'Bitte wählen Sie ein Paket.');if(step===5){if(!val('#standort'))return fail(5,'Bitte wählen Sie einen Standort.');if(!val('#appointmentDate'))return fail(5,'Bitte wählen Sie einen Wunschtermin.');const d=new Date(val('#appointmentDate')+'T12:00:00');if(d.getDay()===0)return fail(5,'Sonntag ist nicht verfügbar. Bitte wählen Sie Montag bis Samstag.');if(!val('#appointmentTime'))return fail(5,'Bitte wählen Sie eine Wunschuhrzeit.');}if(step===6){if(radio('kundentyp')==='Geschäftskunde'&&!val('#company'))return fail(6,'Bitte geben Sie den Firmennamen ein.');if(!val('#first')||!val('#last'))return fail(6,'Bitte geben Sie Vorname und Nachname ein.');if(!/^\S+@\S+\.\S+$/.test(val('#mail')))return fail(6,'Bitte geben Sie eine gültige E-Mail-Adresse ein.');if(!val('#phone'))return fail(6,'Bitte geben Sie eine Telefonnummer ein.');}if(step===7){if(!paymentMethod())return fail(7,'Bitte wählen Sie eine Zahlungsart.');if(radio('kundentyp')!=='Geschäftskunde'&&paymentMethod()==='Rechnung')return fail(7,'Auf Rechnung ist nur für Geschäftskunden möglich.');}return true;}
  async function submitForm(e){
    e.preventDefault();
    if(submitting)return;
    if(!validate(7))return;

    submitting=true;
    const btn=q('#submitBtn');
    if(btn){
      btn.disabled=true;
      btn.textContent='Demo wird geprüft...';
    }

    const price=estimatePrice();
    const s=service();
    const p=pkg();
    const extras=selectedExtras();
    const location=selectedLocation();
    const logic=locationLogic();
    const summary=buildSummary();

    const payload={
      client_id:CONFIG.clientId,
      form_type:'dt_cleaning_lead_v4_google_sheet_mail',
      company_name:CONFIG.companyName,
      formular_typ:'DT-Cleaning Leadformular mit Standortlogik und Zahlungsdemo',

      customer_type:radio('kundentyp'),
      kundentyp:radio('kundentyp'),

      service:s?.title||'',
      reinigung:s?.title||'',
      dienstleistung:s?.title||'',

      package:p?.title||'',
      paket:p?.title||'',
      details:p?.title||'',

      vehicle_type:vehicleTypeLabel(),
      fahrzeug:[vehicleTypeLabel(),val('#vehicleModel')].filter(Boolean).join(' / '),
      vehicle:val('#vehicleModel'),

      extras:extras.map(e=>e.title).join('\n'),

      standort:val('#standort'),
      location:val('#standort'),
      location_address:location?.address||'',
      location_phone:location?.phone||'',
      location_email:location?.email||'',
      location_booking_url:location?.bookingUrl||'',

      allowed_locations:logic.ids.map(id=>byId(CONFIG.locations,id)?.title).filter(Boolean).join('\n'),
      location_logic_rule:logic.rule,
      location_logic_reason:logic.reason,

      appointment_date:val('#appointmentDate'),
      appointment_time:val('#appointmentTime'),

      firma:val('#company'),
      company:val('#company'),

      vorname:val('#first'),
      first_name:val('#first'),

      nachname:val('#last'),
      last_name:val('#last'),

      email:val('#mail'),

      telefon:val('#phone'),
      phone:val('#phone'),

      strasse_nr:val('#street'),
      street:val('#street'),

      plz_ort:val('#city'),
      city:val('#city'),

      nachricht:val('#msg'),
      message:val('#msg'),

      subtotal:String(price.subTotal||''),
      estimated_total:String(price.total||''),
      price_items:price.items.map(i=>`${i.title}: ${money(i.amount)}`).join('\n'),

      payment_method:paymentMethod(),
      zahlungsart:paymentMethod(),
      stripe_demo:'Ja – Testansicht ohne echte Zahlung',

      zusammenfassung:summary,
      website:''
    };

    try{
      await sendDigitalPlusLead(payload, CONFIG);

      const modal=q('#successModal');
      if(modal)modal.classList.add('show');

      /* Demo-Version: Eingaben bleiben zur Ansicht erhalten. */
      current=1;
      renderPackages();
      renderLocations();
      toggleCompany();
      togglePaymentOptions();
      updateTimeSlots();
      updateSummary();
      setStep(1);
    }catch(error){
      setError(7,'Beim Senden ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut oder kontaktieren Sie DT-Cleaning direkt.');
    }finally{
      submitting=false;
      if(btn){
        btn.disabled=false;
        btn.textContent='Demo absenden';
      }
    }
  }
  app.addEventListener('click',e=>{const next=e.target.closest('[data-next]');if(next){if(!validate(current))return;setStep(Math.min(current+1,total));return;}const prev=e.target.closest('[data-prev]');if(prev){setStep(Math.max(current-1,1));return;}const jump=e.target.closest('[data-step-target]');if(jump){const target=Number(jump.dataset.stepTarget);const maxAllowed=getMaxAllowedStep();if(target<=maxAllowed){setStep(target);}else{setError(current,`Bitte füllen Sie zuerst Schritt ${maxAllowed} korrekt aus, bevor Sie weiter nach vorne springen.`);}return;}if(e.target.id==='closeModal'||e.target.id==='successModal')q('#successModal').classList.remove('show');});
  app.addEventListener('change',e=>{if(e.target.name==='kundentyp')toggleCompany();if(e.target.name==='payment_method')togglePaymentOptions();if(e.target.name==='reinigung_id'){renderPackages();renderExtras();const st=q('#standort');if(st)st.value='';q('#appointmentDate').value='';q('#appointmentTime').innerHTML='<option value="">Bitte Datum wählen</option>';renderLocations();updateTimeSlots();}if(e.target.name==='fahrzeugtyp'){renderPackages();}if(e.target.name==='paket_id'||e.target.name==='extras'){renderLocations();updateTimeSlots();}if(e.target.id==='standort'){updateBookingHint();updateTimeSlots();}if(e.target.id==='appointmentDate')updateTimeSlots();if(e.target.matches('input, select, textarea')){clearError(current);updateSummary();updateStepStates();}});
  app.addEventListener('input',e=>{if(e.target.matches('input, select, textarea')){clearError(current);updateSummary();updateStepStates();}});
  q('#dtForm').addEventListener('submit',submitForm);window.addEventListener('resize',renderMobile);setDateMin();renderPackages();renderExtras();renderLocations();toggleCompany();togglePaymentOptions();updateTimeSlots();updateSummary();setStep(1);
})();

/* Digital Plus Demo Helper – Projektversion ohne Datenübertragung */
(function(){
  var DEFAULT_MESSAGE = 'Danke für den Versuch, dieses Formular abzuschicken. Dieses Formular ist eine Projekt- und Testversion. Die Versandfunktion ist deaktiviert. Es wurden keine Daten übertragen und keine E-Mails versendet.';
  window.DP_DEMO_MESSAGE = window.DP_DEMO_MESSAGE || DEFAULT_MESSAGE;
  window.showDigitalPlusDemoNotice = function(message){
    var text = message || window.DP_DEMO_MESSAGE || DEFAULT_MESSAGE;
    var modal = document.getElementById('dpDemoNoticeModal');
    if(!modal){
      modal = document.createElement('div');
      modal.id = 'dpDemoNoticeModal';
      modal.className = 'dp-demo-modal';
      modal.setAttribute('role','dialog');
      modal.setAttribute('aria-modal','true');
      modal.innerHTML = '<div class="dp-demo-card"><div class="dp-demo-head"><div class="dp-demo-icon" aria-hidden="true">ℹ</div><div><h3 class="dp-demo-title">Projektversion – kein Versand</h3></div></div><div class="dp-demo-body"><p data-demo-message></p><div class="dp-demo-note">Alle Auswahlfelder, Schritte und die Übersicht funktionieren weiterhin als Vorschau. Es wird jedoch kein Kontaktformular ausgelöst.</div><div class="dp-demo-actions"><button type="button" class="dp-demo-close">Verstanden</button></div></div></div>';
      document.body.appendChild(modal);
      modal.addEventListener('click', function(event){
        if(event.target === modal || event.target.closest('.dp-demo-close')){
          modal.classList.remove('is-open');
        }
      });
      document.addEventListener('keydown', function(event){
        if(event.key === 'Escape') modal.classList.remove('is-open');
      });
    }
    var messageBox = modal.querySelector('[data-demo-message]');
    if(messageBox) messageBox.textContent = text;
    modal.classList.add('is-open');
    var closeButton = modal.querySelector('.dp-demo-close');
    if(closeButton) closeButton.focus({preventScroll:true});
  };
})();

function sendDigitalPlusLead(payload, preferredConfig){
  var cfg = preferredConfig || (typeof CONFIG !== 'undefined' ? CONFIG : (typeof FORM_CONFIG !== 'undefined' ? FORM_CONFIG : {}));
  var text = (cfg && cfg.noMailMessage) || window.DP_DEMO_MESSAGE || 'Danke für den Versuch, dieses Formular abzuschicken. Dieses Formular ist eine Projekt- und Testversion. Die Versandfunktion ist deaktiviert. Es wurden keine Daten übertragen und keine E-Mails versendet.';
  if(typeof window.showDigitalPlusDemoNotice === 'function') window.showDigitalPlusDemoNotice(text);
  return Promise.resolve({success:true, demo:true, message:text});
}
