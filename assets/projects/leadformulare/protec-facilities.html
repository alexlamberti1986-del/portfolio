  let currentStep = 1;
  let submitting = false;

  function esc(value){
    return String(value == null ? '' : value)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  function slug(value){
    return String(value).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  }

  function serviceCard(service){
    return `
      <div class="pf-option">
        <input type="radio" id="pfService_${esc(service.id)}" name="service" value="${esc(service.title)}" data-service-id="${esc(service.id)}">
        <label for="pfService_${esc(service.id)}">
          <div class="pf-service-card">
            <span class="pf-checkmark">✓</span>
            <div class="pf-option-img"><img src="${esc(service.image)}" alt="${esc(service.title)}"></div>
            <div class="pf-option-body">
              <h3 class="pf-option-title">${esc(service.title)}</h3>
              <p class="pf-option-sub">${esc(service.sub)}</p>
              <span class="pf-option-tag">${esc(service.tag)}</span>
            </div>
          </div>
        </label>
      </div>`;
  }

  function checkboxChip(name, value, label){
    const id = `pf_${name}_${slug(value)}`;
    return `
      <div class="pf-chip">
        <input type="checkbox" id="${esc(id)}" name="${esc(name)}" value="${esc(value)}">
        <label for="${esc(id)}"><span class="pf-bullet"></span><span>${esc(label)}</span></label>
      </div>`;
  }

  function radioCard(name, value, label){
    const id = `pf_${name}_${slug(value)}`;
    return `
      <div class="pf-radio-card">
        <input type="radio" id="${esc(id)}" name="${esc(name)}" value="${esc(value)}">
        <label for="${esc(id)}"><span class="pf-bullet"></span><span>${esc(label)}</span></label>
      </div>`;
  }

  function q(selector){ return app.querySelector(selector); }
  function qa(selector){ return Array.from(app.querySelectorAll(selector)); }
  function val(selector){ const el = q(selector); return el ? String(el.value || '').trim() : ''; }
  function radioValue(name){ const el = q(`input[name="${name}"]:checked`); return el ? el.value : ''; }
  function checks(name){ return qa(`input[name="${name}"]:checked`).map(el => el.value); }

  const SMART_FIELD_RULES = {

      sizeLabel: 'Projektumfang',
      sizes: ['Kleine Ausbesserung', 'Einzelner Raum / kleine Fläche', 'Mehrere Räume', 'Ganzes Objekt / grosse Fläche', 'Noch offen / vor Ort zu beurteilen'],

  function uniqueList(list){ return Array.from(new Set((list || []).filter(Boolean))); }

  function mergeRule(base, patch){
    return {
      objectTypes: uniqueList(patch.objectTypes || base.objectTypes),
      sizeLabel: patch.sizeLabel || base.sizeLabel,
      sizes: uniqueList(patch.sizes || base.sizes),
      frequency: uniqueList(patch.frequency || base.frequency),
      urgency: uniqueList(patch.urgency || base.urgency),
      note: patch.note || base.note || ''
    };
  }

  function selectedProjectTypes(){ return checks('project_type'); }

  function smartRule(){
    const service = selectedService();
    const base = SMART_FIELD_RULES[service?.id] || SMART_FIELD_RULES.default;
    const details = selectedProjectTypes();
    const has = value => details.includes(value);
    let patch = {};

    if(service?.id === 'reinigung'){
      if(['Umzugsreinigung','Baureinigung','Grundreinigung','Hochdruckreinigung'].some(has)){
        patch = {
          frequency: ['Einmaliger Auftrag', 'Termin nach Absprache', 'Noch offen'],
          urgency: ['So schnell wie möglich', 'Innerhalb von 1–2 Wochen', 'Innerhalb von 1 Monat', 'Planung für später'],
          note: 'Bei Umzugs-, Bau-, Grund- oder Hochdruckreinigung wird die Häufigkeit als einmaliger Auftrag geführt.'
        };
      } else if(['Unterhaltsreinigung','Büroreinigung','Wohnungsreinigung'].some(has)){
        patch = {
          frequency: ['Regelmässig wöchentlich', 'Regelmässig alle 2 Wochen', 'Regelmässig monatlich', 'Einmaliger Auftrag', 'Noch offen'],
          urgency: ['Regelmässiger Start nach Absprache', 'Innerhalb von 1–2 Wochen', 'Innerhalb von 1 Monat', 'So schnell wie möglich'],
          note: 'Für Unterhalts-, Büro- und Wohnungsreinigung stehen regelmässige Intervalle im Vordergrund.'
        };
      } else if(has('Fenster / Glas / Storen')){
        patch = {
          frequency: ['Einmaliger Auftrag', 'Alle 3 Monate', 'Halbjährlich', 'Jährlich', 'Nach Bedarf', 'Noch offen'],
          note: 'Für Fenster, Glas und Storen werden typische Turnusse angezeigt.'
        };
      }
    }

    if(service?.id === 'gartenpflege'){
      if(has('Winterdienst / Schneeräumung')){
        patch = {
          frequency: ['Winterdienst Saison', 'Nach Schneefall / auf Abruf', 'Regelmässige Saisonbetreuung', 'Noch offen'],
          urgency: ['Saisonstart nach Absprache', 'So schnell wie möglich', 'Innerhalb von 1–2 Wochen', 'Planung für später'],
          note: 'Bei Winterdienst wird die Häufigkeit saisonal bzw. nach Schneefall geführt.'
        };
      } else if(['Rasenpflege','Hecken / Rückschnitt','Baumschnitt','Saisonale Pflege','Pflanzbeete / Rabatten'].some(has)){
        patch = {
          frequency: ['Einmaliger Auftrag', 'Regelmässig wöchentlich', 'Regelmässig monatlich', 'Saisonale Betreuung', 'Nach Bedarf', 'Noch offen'],
          note: 'Für Gartenpflege werden saisonale und regelmässige Intervalle vorgeschlagen.'
        };
      }
    }

    if(service?.id === 'hauswartung'){
      if(has('Winterdienst')){
        patch = {
          frequency: ['Winterdienst Saison', 'Nach Schneefall / auf Abruf', 'Dauerhafte Liegenschaftsbetreuung', 'Noch offen'],
          urgency: ['Saisonstart nach Absprache', 'So schnell wie möglich', 'Innerhalb von 1–2 Wochen', 'Planung für später'],
          note: 'Winterdienst wird saisonal bzw. nach Wetterlage geplant.'
        };
      } else if(['Kleinreparaturen','Wohnungs- / Parkplatzübergaben'].some(has)){
        patch = {
          frequency: ['Einmaliger Auftrag', 'Nach Bedarf', 'Dauerhafte Liegenschaftsbetreuung', 'Noch offen'],
          note: 'Einzelarbeiten werden nicht als wöchentlicher Standard-Turnus abgefragt.'
        };
      }
    }

    if(service?.id === 'gebaeudetechnik'){
      if(has('Störungsdiagnose')){
        patch = {
          frequency: ['Einmalige Störungsabklärung', 'Nach Bedarf / Pikett', 'Wartungsvertrag gewünscht', 'Noch offen'],
          urgency: ['So schnell wie möglich', 'Innerhalb von 1–2 Wochen', 'Innerhalb von 1 Monat'],
          note: 'Bei Störungen wird die Anfrage als Abklärung oder Pikett-/Wartungsthema geführt.'
        };
      } else if(['Wartung / Inspektion','Heizung','Lüftung / Klima','Elektro','Sanitär'].some(has)){
        patch = {
          frequency: ['Einmalige Kontrolle / Reparatur', 'Regelmässige Wartung', 'Jährliche Inspektion', 'Dauerhafte technische Betreuung', 'Noch offen'],
          note: 'Für technische Anlagen werden Wartung und Inspektion priorisiert.'
        };
      }
    }

    if(service?.id === 'maler-gipser'){
      patch = {
        frequency: ['Einmaliger Auftrag', 'Etappenweise Ausführung', 'Nach Bedarf', 'Noch offen'],
        note: 'Maler- und Gipserarbeiten werden in der Regel projektbezogen statt als Reinigungs-Turnus geplant.'
      };
    }

    return mergeRule(base, patch);
  }

  function fillSelect(selector, options, placeholder){
    const el = q(selector);
    if(!el) return;
    const previous = el.value;
    el.innerHTML = `<option value="">${esc(placeholder || 'Bitte auswählen')}</option>` + (options || []).map(option => `<option>${esc(option)}</option>`).join('');
    if((options || []).includes(previous)) el.value = previous;
    else el.value = '';
  }

  function updateSmartFields(){
    const service = selectedService();
    const sizeLabel = q('label[for="pfSize"]');
    if(!service){
      if(sizeLabel) sizeLabel.innerHTML = 'Grösse / Umfang <span class="pf-req">*</span>';
      fillSelect('#pfObjectType', [], 'Bitte zuerst Dienstleistung wählen');
      fillSelect('#pfSize', [], 'Bitte zuerst Dienstleistung wählen');
      fillSelect('#pfFrequency', [], 'Bitte zuerst Dienstleistung wählen');
      fillSelect('#pfUrgency', SMART_FIELD_RULES.default.urgency, 'Bitte auswählen');
      const emptyNote = q('#pfFrequencyNote');
      if(emptyNote) emptyNote.textContent = 'Die Auswahl wird automatisch an die gewählte Dienstleistung angepasst.';
      return;
    }
    const rule = smartRule();
    if(sizeLabel) sizeLabel.innerHTML = `${esc(rule.sizeLabel)} <span class="pf-req">*</span>`;
    fillSelect('#pfObjectType', rule.objectTypes, 'Bitte auswählen');
    fillSelect('#pfSize', rule.sizes, 'Bitte auswählen');
    fillSelect('#pfFrequency', rule.frequency, 'Bitte auswählen');
    fillSelect('#pfUrgency', rule.urgency, 'Bitte auswählen');
    const note = q('#pfFrequencyNote');
    if(note) note.textContent = rule.note || 'Die Häufigkeit wurde passend zur Dienstleistung angepasst.';
  }

  function todayISO(){
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,10);
  }

  function isSundayDate(value){
    if(!value) return false;
    const date = new Date(`${value}T12:00:00`);
    return !Number.isNaN(date.getTime()) && date.getDay() === 0;
  }

  function selectedService(){
    const selected = q('input[name="service"]:checked');
    if(!selected) return null;
    return SERVICES.find(service => service.id === selected.dataset.serviceId) || null;
  }

    const intro = q('#pfDetailIntro');
    const box = q('#pfProjectTypes');
    if(!service){
      intro.classList.remove('pf-hidden');
      intro.textContent = 'Bitte wählen Sie zuerst in Schritt 1 eine Dienstleistung aus.';
      box.innerHTML = '';
      updateSmartFields();
      return;
    }
    intro.classList.remove('pf-hidden');
    intro.textContent = `Auswahl für ${service.title}: Wählen Sie mindestens eine passende Projektart aus.`;
    box.innerHTML = service.details.map(detail => checkboxChip('project_type', detail, detail)).join('');
    updateSmartFields();
  }

  function clearError(step){
    const box = q(`[data-error="${step}"]`);
    if(box){ box.textContent = ''; box.classList.remove('pf-show'); }
  }

  function showError(step, message){
    const box = q(`[data-error="${step}"]`);
    if(box){ box.textContent = message; box.classList.add('pf-show'); }
  }

  function validateStep(step, silent){
    if(!silent) clearError(step);
    const fail = message => { if(!silent) showError(step, message); return false; };
    if(step === 1 && !selectedService()) return fail('Bitte wählen Sie eine Dienstleistung aus.');
    if(step === 2 && checks('project_type').length < 1) return fail('Bitte wählen Sie mindestens eine Projektart aus.');
    if(step === 3){
      if(!val('#pfObjectType')) return fail('Bitte wählen Sie die Objektart aus.');
      if(!val('#pfSize')) return fail('Bitte wählen Sie die Grösse bzw. den Umfang aus.');
    }
    if(step === 4 && isSundayDate(val('#pfPreferredDate'))) return fail('Bitte wählen Sie einen Wunschtermin von Montag bis Samstag. Sonntag ist nicht verfügbar.');
    if(step === 6){
      if(!val('#pfFirstName')) return fail('Bitte geben Sie den Vornamen ein.');
      if(!val('#pfLastName')) return fail('Bitte geben Sie den Nachnamen ein.');
      if(!val('#pfPhone')) return fail('Bitte geben Sie eine Telefonnummer ein.');
      if(!/^\S+@\S+\.\S+$/.test(val('#pfEmail'))) return fail('Bitte geben Sie eine gültige E-Mail-Adresse ein.');
    }
    return true;
  }

  function maxAllowedStep(){
    let max = 1;
    for(let i=1; i<=STEPS.length; i++){
      if(validateStep(i, true)) max = Math.min(i + 1, STEPS.length);
      else { max = i; break; }
    }
    return max;
  }

  function updateStepStates(){
    const max = maxAllowedStep();
    qa('[data-step-node]').forEach(node => {
      const step = Number(node.dataset.stepNode);
      node.classList.remove('pf-active','pf-done','pf-available','pf-locked');
      if(step < currentStep) node.classList.add('pf-done');
      if(step === currentStep) node.classList.add('pf-active');
      if(step <= max) node.classList.add('pf-available');
      else node.classList.add('pf-locked');
      const btn = node.querySelector('button');
      if(btn) btn.disabled = step > max;
    });
  }

  function setStep(step){
    currentStep = Math.max(1, Math.min(STEPS.length, Number(step) || 1));
    qa('[data-panel]').forEach(panel => {
      panel.classList.toggle('pf-active-panel', Number(panel.dataset.panel) === currentStep);
    });
    q('#pfStepText').textContent = `Schritt ${currentStep} von ${STEPS.length}`;
    q('#pfStepLabel').textContent = STEPS[currentStep - 1];
    clearError(currentStep);
    updateSummary();
    updateStepStates();
    const y = app.getBoundingClientRect().top + window.pageYOffset - 18;
    window.scrollTo({ top: y, behavior: 'smooth' });
  }

  function detailsText(){ return checks('project_type').join('\n'); }
  function contactWishText(){ return checks('contact_wish').join('\n'); }
  function dateText(){
    const parts = [];
    if(val('#pfPreferredDate')) parts.push(`Wunschtermin: ${val('#pfPreferredDate')}`);
    if(val('#pfUrgency')) parts.push(`Dringlichkeit: ${val('#pfUrgency')}`);
    return parts.join(' / ');
  }
  function objectText(){
    return [val('#pfObjectType'), val('#pfSize'), val('#pfFrequency'), val('#pfLocation') ? `Standort: ${val('#pfLocation')}` : ''].filter(Boolean).join(' / ');
  }
  function contactText(){
    return [val('#pfCompany'), [val('#pfFirstName'), val('#pfLastName')].filter(Boolean).join(' '), val('#pfPhone'), val('#pfEmail')].filter(Boolean).join(' / ');
  }

  function summaryRows(){
    const service = selectedService();
    return [
      ['Dienstleistung', service ? service.title : 'Noch keine Auswahl'],
      ['Projektart', detailsText() || 'Noch keine Auswahl'],
      ['Objekt & Umfang', objectText() || 'Noch keine Auswahl'],
      ['Zeitrahmen', dateText() || 'Noch keine Auswahl'],
      ['Kontaktwunsch', contactWishText() || 'Noch keine Auswahl'],
      ['Bilderlink', val('#pfImageLink') || 'Optional'],
      ['Kontakt', contactText() || 'Noch keine Angaben']
    ];
  }

  function renderSummaryHtml(){
    return summaryRows().map(([label, value]) => `
      <div class="pf-summary-row">
        <span class="pf-summary-label">${esc(label)}</span>
        <span class="pf-summary-value">${esc(value)}</span>
      </div>`).join('');
  }

  function updateSummary(){
    const html = renderSummaryHtml();
    q('#pfSummaryBox').innerHTML = html;
    const mobile = q('#pfMobileSummary');
    if(mobile){
      mobile.innerHTML = `<div class="pf-aside-card" style="position:static!important;display:block!important;"><h3 class="pf-summary-title">Ihre Übersicht</h3><p class="pf-summary-sub">Alle Angaben werden live zusammengefasst.</p><div class="pf-summary-box">${html}</div></div>`;
    }
  }

  function buildSummary(){
    const service = selectedService();
    return [
      `Dienstleistung: ${service ? service.title : '-'}`,
      `Projektart: ${detailsText() || '-'}`,
      `Objektart: ${val('#pfObjectType') || '-'}`,
      `Grösse / Umfang: ${val('#pfSize') || '-'}`,
      `Häufigkeit: ${val('#pfFrequency') || '-'}`,
      `Standort Objekt: ${val('#pfLocation') || '-'}`,
      `Wunschtermin: ${val('#pfPreferredDate') || '-'}`,
      `Dringlichkeit: ${val('#pfUrgency') || '-'}`,
      `Kontaktwunsch: ${contactWishText() || '-'}`,
      `Bilder-/Dateilink: ${val('#pfImageLink') || '-'}`,
      `Projektbeschreibung / Bemerkungen: ${val('#pfMessage') || '-'}`,
      `Firma / Verwaltung: ${val('#pfCompany') || '-'}`,
      `Vorname: ${val('#pfFirstName') || '-'}`,
      `Nachname: ${val('#pfLastName') || '-'}`,
      `Strasse / Nr.: ${val('#pfStreet') || '-'}`,
      `PLZ / Ort: ${val('#pfPostalCity') || '-'}`,
      `Telefon: ${val('#pfPhone') || '-'}`,
      `E-Mail: ${val('#pfEmail') || '-'}`
    ].join('\n');
  }

  function buildPayload(){
    const service = selectedService();
    const serviceName = service ? service.title : '';
    const location = [val('#pfStreet'), val('#pfPostalCity')].filter(Boolean).join(', ') || val('#pfLocation');
    const extras = [
      `Objekt: ${val('#pfObjectType') || '-'}`,
      `Grösse: ${val('#pfSize') || '-'}`,
      `Häufigkeit: ${val('#pfFrequency') || '-'}`,
      `Wunschtermin: ${val('#pfPreferredDate') || '-'}`,
      `Dringlichkeit: ${val('#pfUrgency') || '-'}`,
      `Kontaktwunsch: ${contactWishText() || '-'}`,
      `Bilderlink: ${val('#pfImageLink') || '-'}`
    ].join(' | ');

    return {
      client_id: CONFIG.clientId,
      company_name: CONFIG.companyName,
      form_type: CONFIG.formType,
      service: serviceName,
      reinigung: serviceName === 'Reinigung' ? detailsText() : '',
      paket: detailsText(),
      package: detailsText(),
      details: detailsText(),
      // Verhindert doppelte Mail-Zeilen, da Objekt/Zeit/Kontaktwunsch separat gesendet werden.
      extras: '',
      standort: location,
      location: location,
      firma: val('#pfCompany'),
      company: val('#pfCompany'),
      vorname: val('#pfFirstName'),
      first_name: val('#pfFirstName'),
      nachname: val('#pfLastName'),
      last_name: val('#pfLastName'),
      telefon: val('#pfPhone'),
      phone: val('#pfPhone'),
      email: val('#pfEmail'),
      nachricht: val('#pfMessage'),
      message: val('#pfMessage'),
      zusammenfassung: buildSummary(),
      website: val('#pfWebsite'),

      // Branchenspezifische Zusatzfelder
      dienstleistung: serviceName,
      projektart: detailsText(),
      objektart: val('#pfObjectType'),
      groesse: val('#pfSize'),
      haeufigkeit: val('#pfFrequency'),
      objekt_standort: val('#pfLocation'),
      wunschtermin: val('#pfPreferredDate'),
      dringlichkeit: val('#pfUrgency'),
      zeitrahmen: dateText(),
      kontaktwunsch: contactWishText(),
      bilderlink: val('#pfImageLink'),
      strasse_nr: val('#pfStreet'),
      plz_ort: val('#pfPostalCity')
    };
  }

  function showStatus(message, ok){
    const box = q('#pfSubmitStatus');
    if(!box) return;
    box.textContent = message;
    box.classList.add('pf-show');
    box.style.color = ok ? 'var(--pf-success)' : 'var(--pf-error)';
    box.style.background = ok ? '#f0fdf4' : '#fff4f2';
    box.style.borderColor = ok ? '#bbf7d0' : '#fecdca';
  }

  

  async function submitForm(event){
    event.preventDefault();
    if(submitting) return;
    for(let i=1; i<=STEPS.length; i++){
      if(!validateStep(i, false)) { setStep(i); return; }
    }
    if(val('#pfWebsite')) return;

    submitting = true;
    const btn = q('#pfSubmitBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Demo wird geprüft...';
    const payload = buildPayload();

    try {
      await sendDigitalPlusLead(payload, CONFIG);
      btn.textContent = 'Demo angezeigt';
      showStatus(CONFIG.successText, true);
    } catch(error) { submitting = false; btn.disabled = false; btn.textContent = originalText; showStatus(CONFIG.noMailMessage || CONFIG.errorText || 'Dies ist eine Projektversion ohne Datenübertragung.', true); }
  }

  app.addEventListener('click', event => {
    const next = event.target.closest('[data-next]');
    if(next){
      if(!validateStep(currentStep, false)) return;
      setStep(currentStep + 1);
      return;
    }
    const prev = event.target.closest('[data-prev]');
    if(prev){
      setStep(currentStep - 1);
      return;
    }
    const jump = event.target.closest('[data-jump]');
    if(jump){
      const target = Number(jump.dataset.jump);
      const max = maxAllowedStep();
      if(target <= max) setStep(target);
      else showError(currentStep, `Bitte füllen Sie zuerst Schritt ${max} aus, bevor Sie weiter springen.`);
    }
  });

  app.addEventListener('change', event => {
    if(event.target.matches('input[name="service"]')){
      renderProjectTypes();
      clearError(1);
      clearError(2);
    }
    if(event.target.matches('input[name="project_type"]')){
      updateSmartFields();
      clearError(2);
    }
    if(event.target.matches('input, select, textarea')){
      clearError(currentStep);
      if(event.target.id === 'pfPreferredDate' && isSundayDate(event.target.value)){
        event.target.value = '';
        showError(4, 'Sonntag ist nicht verfügbar. Bitte wählen Sie einen Wunschtermin von Montag bis Samstag.');
      }
      updateSummary();
      updateStepStates();
    }
  });

  app.addEventListener('input', event => {
    if(event.target.matches('input, select, textarea')){
      clearError(currentStep);
      updateSummary();
      updateStepStates();
    }
  });

  renderSteps();
  renderServices();
  renderProjectTypes();
  const preferredDate = q('#pfPreferredDate');
  if(preferredDate) preferredDate.min = todayISO();
  q('#pfLeadForm').addEventListener('submit', submitForm);
  updateSummary();
  setStep(1);
})();

/* Digital Plus Demo Helper – Projektversion ohne Datenübertragung */
(function(){
  var DEFAULT_MESSAGE = 'Danke für den Versuch, dieses Formular abzuschicken. Dieses Formular ist eine Projekt- und Testversion. Die Versandfunktion ist deaktiviert. Es wurden keine Daten übertragen und keine E-Mails versendet.';
  window.DP_DEMO_MESSAGE = window.DP_DEMO_MESSAGE || DEFAULT_MESSAGE;
  window.showDigitalPlusDemoNotice = function(message){
    var text = message || window.DP_DEMO_MESSAGE || DEFAULT_MESSAGE;
    var modal = document.getElementById('dpDemoNoticeModal');
    if(!modal){
      modal = document.createElement('div');
      modal.id = 'dpDemoNoticeModal';
      modal.className = 'dp-demo-modal';
      modal.setAttribute('role','dialog');
      modal.setAttribute('aria-modal','true');
      modal.innerHTML = '<div class="dp-demo-card"><div class="dp-demo-head"><div class="dp-demo-icon" aria-hidden="true">ℹ</div><div><h3 class="dp-demo-title">Projektversion – kein Versand</h3></div></div><div class="dp-demo-body"><p data-demo-message></p><div class="dp-demo-note">Alle Auswahlfelder, Schritte und die Übersicht funktionieren weiterhin als Vorschau. Es wird jedoch kein Kontaktformular ausgelöst.</div><div class="dp-demo-actions"><button type="button" class="dp-demo-close">Verstanden</button></div></div></div>';
      document.body.appendChild(modal);
      modal.addEventListener('click', function(event){
        if(event.target === modal || event.target.closest('.dp-demo-close')){
          modal.classList.remove('is-open');
        }
      });
      document.addEventListener('keydown', function(event){
        if(event.key === 'Escape') modal.classList.remove('is-open');
      });
    }
    var messageBox = modal.querySelector('[data-demo-message]');
    if(messageBox) messageBox.textContent = text;
    modal.classList.add('is-open');
    var closeButton = modal.querySelector('.dp-demo-close');
    if(closeButton) closeButton.focus({preventScroll:true});
  };
})();

function sendDigitalPlusLead(payload, preferredConfig){
  var cfg = preferredConfig || (typeof CONFIG !== 'undefined' ? CONFIG : (typeof FORM_CONFIG !== 'undefined' ? FORM_CONFIG : {}));
  var text = (cfg && cfg.noMailMessage) || window.DP_DEMO_MESSAGE || 'Danke für den Versuch, dieses Formular abzuschicken. Dieses Formular ist eine Projekt- und Testversion. Die Versandfunktion ist deaktiviert. Es wurden keine Daten übertragen und keine E-Mails versendet.';
  if(typeof window.showDigitalPlusDemoNotice === 'function') window.showDigitalPlusDemoNotice(text);
  return Promise.resolve({success:true, demo:true, message:text});
}
