<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spitex Xundheit Plus – Pflegeanfrage</title>
<style>
:root{
  --green:#5E9F3A;
  --green-dark:#4A7F2E;
  --green-soft:#EEF7E8;
  --blue:#24A8DF;
  --blue-dark:#1183B9;
  --bg:#F5FAFD;
  --line:#D9ECF4;
  --muted:#667085;
  --text:#101827;
  --white:#fff;
  --shadow:0 26px 70px rgba(15,23,42,.10);
  --shadow-sm:0 12px 32px rgba(15,23,42,.08);
  --radius-xl:28px;
  --radius-lg:22px;
  --radius-md:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(62,171,52,.16),transparent 30%),linear-gradient(180deg,#fff 0%,var(--bg) 72%)}
a{color:var(--blue)}
img{max-width:100%;display:block}
.wrap{max-width:1540px;margin:0 auto;padding:22px 16px 42px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.main,.side{border-radius:30px;box-shadow:var(--shadow)}
.main{background:rgba(255,255,255,.98);padding:30px;border:1px solid rgba(220,232,221,.96)}
.side{position:sticky;top:24px;padding:26px;background:linear-gradient(180deg,var(--blue) 0%,var(--blue-dark) 100%);color:#fff;overflow:hidden}
.side:before{content:"";position:absolute;right:-65px;top:-70px;width:210px;height:210px;border-radius:999px;background:rgba(62,171,52,.18)}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.brand-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:84px;max-width:300px;object-fit:contain;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 10px 22px rgba(18,32,51,.08)}
.badge{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:rgba(62,171,52,.12);color:var(--green-dark);font-size:13px;font-weight:900}
.badge .dot{width:10px;height:10px;border-radius:999px;background:var(--green)}
h1{margin:0;font-size:clamp(34px,4.2vw,58px);line-height:1.02;letter-spacing:-.04em;color:var(--blue)}
.sub{margin:10px 0 0;max-width:980px;color:var(--muted);font-size:17px;line-height:1.75}
.progress{margin:26px 0 24px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow-sm)}
.progress-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.progress-top strong{font-size:15px;color:var(--blue)}
.progress-top span{font-size:14px;color:var(--muted);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;position:relative}
.steps:before{content:"";position:absolute;left:24px;right:24px;top:22px;height:2px;background:var(--line)}
.step{position:relative;z-index:1;text-align:center}
.step-btn{appearance:none;border:0;background:transparent;padding:0;margin:0;width:100%;color:inherit;cursor:pointer}
.step-btn[disabled]{cursor:not-allowed}
.circle{width:44px;height:44px;margin:0 auto 10px;border-radius:999px;background:#E8F1E9;color:#475569;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(255,255,255,.96);transition:.2s}
.label{font-size:12px;font-weight:800;color:#475569;line-height:1.25;transition:.2s}
.step.available .circle{background:#eef8ee;color:var(--green-dark)}
.step.available .label{color:#334155}
.step.active .circle,.step.done .circle{background:var(--green);color:#fff}
.step.done .label,.step.active .label{color:var(--blue)}
.step:not(.locked) .step-btn:hover .circle{transform:none;box-shadow:0 0 0 8px rgba(255,255,255,.96),0 10px 24px rgba(18,32,51,.12)}
.card{background:#fff;border:1px solid rgba(220,232,221,.95);border-radius:30px;padding:32px;box-shadow:0 18px 40px rgba(15,23,42,.07);min-height:780px;display:flex;flex-direction:column}
.panel{display:none;flex:1;flex-direction:column}
.panel.active{display:flex}
.kicker{font-size:13px;font-weight:900;color:var(--green-dark);letter-spacing:.09em;text-transform:uppercase;margin-bottom:12px}
h2{margin:0;font-size:clamp(26px,2.5vw,40px);line-height:1.12;color:var(--blue)}
.desc{margin:12px 0 0;color:var(--muted);font-size:16px;line-height:1.72;max-width:920px}
.divider{height:1px;background:linear-gradient(90deg,var(--line),rgba(220,232,221,.15));margin:24px 0 26px}
.hero{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;border:1px solid var(--line);background:linear-gradient(135deg,#fff 0%,var(--green-soft) 100%);border-radius:24px;padding:16px;margin-bottom:24px;align-items:center}
.hero-img{height:180px;border-radius:18px;overflow:hidden;background:#edf5ee}
.hero-img img{width:100%;height:100%;object-fit:cover}
.hero-copy h3{margin:0 0 8px;font-size:22px;line-height:1.15;color:var(--blue)}
.hero-copy p{margin:0;color:var(--muted);line-height:1.7;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.option{position:relative}
.option input{position:absolute;opacity:0;pointer-events:none}
.option label{display:block;height:100%}
.option-card{position:relative;display:flex;flex-direction:column;min-height:285px;height:100%;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#fff;box-shadow:var(--shadow-sm);cursor:pointer;transition:.22s}
.option-card:hover{transform:none;box-shadow:0 20px 40px rgba(18,32,51,.12)}
.option input:checked + label .option-card{border-color:rgba(62,171,52,.6);box-shadow:0 20px 40px rgba(62,171,52,.16);transform:none}
.check{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 20px rgba(15,23,42,.1);z-index:3}
.option input:checked + label .check{background:var(--green);border-color:transparent}
.option input:checked + label .check:after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.option-img{height:156px;background:#eef6ee;overflow:hidden}
.option-img img{width:100%;height:100%;object-fit:cover}
.option-body{padding:19px;display:flex;flex-direction:column;gap:9px;flex:1}
.option-title{margin:0;font-size:20px;line-height:1.15;font-weight:900;color:var(--blue)}
.option-sub{font-size:14px;line-height:1.65;color:var(--muted)}
.option-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(11,69,139,.08);color:var(--blue);font-size:12px;font-weight:800;width:max-content}
.chip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip label{display:flex;gap:12px;align-items:center;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:#F8FBF8;min-height:72px;cursor:pointer;font-weight:800;color:#334155;line-height:1.3;transition:background .2s,border-color .2s,color .2s,box-shadow .2s;box-shadow:none;transform:none}
.chip .bullet{width:18px;height:18px;border-radius:999px;border:2px solid #cbd5e1;background:#fff;flex-shrink:0;margin-top:0;display:inline-flex;align-items:center;justify-content:center}
.chip .chip-text{display:block;flex:1}
.chip input:checked + label{border-color:rgba(62,171,52,.42);background:rgba(62,171,52,.10);color:var(--green-dark);box-shadow:none;transform:none}
.chip input:checked + label .bullet{background:var(--green);border-color:var(--green)}
.chip input:checked + label .bullet:after{content:"";display:block;width:6px;height:6px;background:#fff;border-radius:999px;margin:0}
.select-stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.field label{display:block;margin:0 0 10px;font-size:14px;font-weight:800;color:var(--blue)}
.req{color:var(--green-dark)}
.input,.select,.textarea{width:100%;min-height:56px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:15px;outline:none;color:var(--text);transition:.2s}
.textarea{min-height:130px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:rgba(62,171,52,.55);box-shadow:0 0 0 5px rgba(62,171,52,.10)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.full{grid-column:1 / -1}
.info-box{border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff 0%,var(--green-soft) 100%);padding:18px;color:#334155;line-height:1.65;font-weight:650}
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.mini-card{border:1px solid var(--line);border-radius:22px;background:#fff;overflow:hidden;box-shadow:var(--shadow-sm)}
.mini-card .mini-top{height:115px;overflow:hidden;background:#eff6ef}
.mini-card .mini-top img{width:100%;height:100%;object-fit:cover}
.mini-card .mini-body{padding:16px}
.mini-card h4{margin:0 0 8px;font-size:17px;color:var(--blue)}
.mini-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.yesno{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.question-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;grid-column:1 / -1}
.question-box{border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#fff 0%,#f8fcf8 100%);padding:18px;box-shadow:var(--shadow-sm)}
.question-box .field-label{display:block;margin:0 0 14px;font-size:16px;font-weight:900;color:var(--blue)}
.radio-card{position:relative}
.radio-card input{position:absolute;opacity:0;pointer-events:none}
.radio-card label{display:flex;align-items:center;justify-content:center;min-height:70px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--blue);font-size:18px;font-weight:900;cursor:pointer;transition:background .18s,border-color .18s,box-shadow .18s,color .18s;line-height:1}
.radio-card input:checked + label{border-color:rgba(62,171,52,.55);background:rgba(62,171,52,.10);color:var(--green-dark);box-shadow:0 8px 18px rgba(62,171,52,.10)}
.radio-card label:before{content:"";width:18px;height:18px;border-radius:999px;border:2px solid #cbd5e1;background:#fff;margin-right:10px;flex:0 0 auto}
.radio-card input:checked + label:before{border-color:var(--green);background:radial-gradient(circle at center,#fff 0 28%,var(--green) 31% 100%)}
.upload-box{border:1px dashed rgba(11,69,139,.25);border-radius:20px;background:linear-gradient(135deg,#fff 0%,var(--green-soft) 100%);padding:18px}
.upload-box input[type=file]{padding:14px;background:#fff;cursor:pointer}
.file-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.file-item{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(11,69,139,.08);color:var(--blue);font-size:13px;font-weight:800}
.autofill-box{border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff 0%,var(--green-soft) 100%);padding:18px;color:#334155;line-height:1.7;font-weight:650}
.autofill-box strong{display:block;margin-bottom:6px;color:var(--blue)}
.contact-note{font-size:13px;color:var(--muted);line-height:1.6;margin-top:8px}

.summary-title{margin:0 0 10px;font-size:24px;font-weight:900;position:relative;z-index:1}
.summary-sub{margin:0 0 22px;color:rgba(255,255,255,.72);font-size:14px;line-height:1.7;position:relative;z-index:1}
.summary-box{position:relative;z-index:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:18px}
.summary-row{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.summary-row:last-child{border-bottom:0}
.summary-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:800}
.summary-value{font-size:14px;line-height:1.7;font-weight:700;word-break:break-word}
.actions{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:auto;padding-top:28px;flex-wrap:wrap}
.btn{appearance:none;border:0;min-height:56px;padding:0 24px;border-radius:16px;font-size:15px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;transition:.2s}
.btn.secondary{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);color:var(--blue)}
.btn.primary,.btn.dark{background:var(--green);color:#fff;box-shadow:0 18px 34px rgba(62,171,52,.24)}
.btn.primary:hover,.btn.dark:hover{background:var(--green-dark)}
.error{display:none;margin-top:14px;padding:14px 16px;border-radius:16px;background:rgba(62,171,52,.08);color:var(--green-dark);border:1px solid rgba(62,171,52,.16);font-size:14px;font-weight:800}
.error.show{display:block}
.mobile-summary{display:none}
.hidden{display:none !important}
.small-muted{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}
.select-note{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.6}
@media (max-width:1350px){
  .wrap{grid-template-columns:1fr}
  .side{display:none}
  .mobile-summary{display:block;margin-top:18px}
}
@media (max-width:1180px){
  .grid,.chip-grid,.fields,.select-stack,.mini-grid,.question-grid{grid-template-columns:1fr 1fr}
  .hero{grid-template-columns:1fr}
}
@media (max-width:780px){
  .wrap{padding:12px 8px 26px}
  .main{padding:16px;border-radius:22px}
  .card{padding:16px;min-height:auto}
  .grid,.chip-grid,.fields,.select-stack,.mini-grid,.question-grid{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(4,minmax(0,1fr))}
  .steps:before{display:none}
  .progress{padding:18px}
  .actions{flex-direction:column}
  .actions .btn{width:100%}
  .hero-img{height:160px}
}

/* Spitex-spezifisches Layout: bewusst anders als TOKA */
body{
  background:
    radial-gradient(circle at 8% 8%, rgba(36,168,223,.20), transparent 28%),
    radial-gradient(circle at 90% 14%, rgba(94,159,58,.18), transparent 26%),
    linear-gradient(135deg,#F7FCFF 0%,#EEF8F3 52%,#FFFFFF 100%);
}
.wrap{max-width:1480px;grid-template-columns:minmax(0,1fr) 390px;gap:30px;padding:30px 18px 48px}
.main{padding:0;border-radius:36px;overflow:hidden;border:1px solid rgba(36,168,223,.18);background:rgba(255,255,255,.94)}
.brand{margin:0;padding:34px 36px 30px;background:linear-gradient(135deg,rgba(36,168,223,.12),rgba(94,159,58,.10));border-bottom:1px solid rgba(36,168,223,.12)}
.logo{height:98px;max-width:340px;border-radius:26px;padding:14px 18px;box-shadow:0 14px 30px rgba(36,168,223,.13)}
h1{color:#159BD2;letter-spacing:-.035em;max-width:900px}.sub{max-width:980px}
.progress{margin:0 36px 26px;transform:translateY(-10px);border-radius:24px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px)}
.steps{gap:10px}.steps:before{display:none}.circle{width:42px;height:42px;box-shadow:none;border:2px solid rgba(36,168,223,.14)}
.step{padding:8px;border-radius:18px;background:#F8FCFD}.step.active,.step.done{background:linear-gradient(135deg,rgba(36,168,223,.10),rgba(94,159,58,.10))}
.card{margin:0 36px 36px;border-radius:34px;padding:34px;border-color:rgba(36,168,223,.14);box-shadow:0 22px 54px rgba(18,131,185,.10)}
.side{border-radius:36px;background:linear-gradient(160deg,#159BD2 0%,#24A8DF 48%,#5E9F3A 100%);box-shadow:0 26px 70px rgba(36,168,223,.18)}
.side:before{right:-90px;top:-90px;width:260px;height:260px;background:rgba(255,255,255,.18)}
.hero{grid-template-columns:340px minmax(0,1fr);border-radius:30px;padding:18px;background:linear-gradient(135deg,rgba(36,168,223,.08),rgba(94,159,58,.10));border-color:rgba(36,168,223,.18)}
.hero-img{height:220px;border-radius:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.option-card{min-height:335px;border-radius:30px;border-color:rgba(36,168,223,.16);box-shadow:0 18px 42px rgba(36,168,223,.09)}
.option-img{height:190px;background:linear-gradient(135deg,#EAF7FF,#EEF7E8)}
.option-card:hover{box-shadow:0 22px 48px rgba(36,168,223,.16);transform:translateY(-2px)}
.option input:checked + label .option-card{border-color:rgba(36,168,223,.65);box-shadow:0 24px 56px rgba(94,159,58,.18)}
.option-title{color:#159BD2}.option-tag{background:rgba(94,159,58,.12);color:#4A7F2E}.check{border-color:rgba(36,168,223,.18)}
.chip label,.question-box,.mini-card{border-radius:24px;border-color:rgba(36,168,223,.16);background:#FBFEFF}.mini-card .mini-top{height:145px;background:#EAF7FF}.btn{border-radius:999px}.btn.primary,.btn.dark{background:linear-gradient(135deg,#24A8DF,#5E9F3A);box-shadow:0 18px 34px rgba(36,168,223,.20)}.btn.primary:hover,.btn.dark:hover{filter:brightness(.96)}
@media (max-width:1350px){.side{display:none}.wrap{grid-template-columns:1fr}.mobile-summary{display:block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:780px){.brand{padding:22px 18px}.progress{margin:0 18px 20px}.card{margin:0 18px 20px;padding:20px}.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero-img{height:180px}.option-img{height:175px}}


/* FINAL v3: Schritt 1 bleibt wie in der gelieferten Spitex-Datei. Nur Schritte 3-6 bekommen ein anderes Spitex-Zuhause-Layout. */
.panel[data-step="3"] .hero,.panel[data-step="4"] .hero,.panel[data-step="5"] .hero,.panel[data-step="6"] .hero{display:grid!important;grid-template-columns:minmax(280px,42%) minmax(0,1fr)!important;gap:0!important;padding:0!important;border-radius:34px!important;overflow:hidden!important;border:1px solid rgba(36,168,223,.18)!important;background:#fff!important;box-shadow:0 22px 54px rgba(18,131,185,.12)!important}
.panel[data-step="3"] .hero-img,.panel[data-step="4"] .hero-img,.panel[data-step="5"] .hero-img,.panel[data-step="6"] .hero-img{height:310px!important;border-radius:0!important}.panel[data-step="3"] .hero-img img,.panel[data-step="4"] .hero-img img,.panel[data-step="5"] .hero-img img,.panel[data-step="6"] .hero-img img{object-position:center center!important}.panel[data-step="3"] .hero-copy,.panel[data-step="4"] .hero-copy,.panel[data-step="5"] .hero-copy,.panel[data-step="6"] .hero-copy{padding:34px 38px!important;background:radial-gradient(circle at 92% 8%,rgba(94,159,58,.16),transparent 30%),linear-gradient(135deg,rgba(36,168,223,.09),rgba(94,159,58,.10))!important;display:flex!important;flex-direction:column!important;justify-content:center!important}.panel[data-step="3"] .hero-copy h3,.panel[data-step="4"] .hero-copy h3,.panel[data-step="5"] .hero-copy h3,.panel[data-step="6"] .hero-copy h3{font-size:clamp(26px,3vw,38px)!important;line-height:1.08!important;color:#1183B9!important;margin-bottom:12px!important}.panel[data-step="3"] .hero-copy p,.panel[data-step="4"] .hero-copy p,.panel[data-step="5"] .hero-copy p,.panel[data-step="6"] .hero-copy p{font-size:16px!important;line-height:1.8!important}

#tokaLeadApp .panel[data-step="7"] .wishes-grid .chip input:checked + label .bullet:after {
  width: 7px !important;
  height: 7px !important;

  flex: 1 !important;
  padding-top: 1px !important;

(function(){

  const q = s => app.querySelector(s);
  const qa = s => [...app.querySelectorAll(s)];
  const val = s => q(s) ? q(s).value.trim() : '';
  const checks = name => qa(`input[name="${name}"]:checked`).map(x => x.value);
  const radio = name => { const el = q(`input[name="${name}"]:checked`); return el ? el.value : ''; };
  const selectedServiceIds = () => qa('input[name="services"]:checked').map(x => x.dataset.id);
  const detailValues = () => checks('details');
  const selectedServiceTitles = () => selectedServiceIds().map(id => {
    const service = SERVICES.find(x => x.id === id);
    return service ? service.title : id;
  });
  function missingDetailGroups(){
    return selectedServiceIds().filter(id => {
      const group = q(`[data-service-id="${id}"]`);
      return !group || !group.querySelector('input[name="details"]:checked');

      const service = SERVICES.find(x => x.id === id);
      return service ? service.title : id;
    });
  }

  function clearError(step){
    const box = q(`[data-error-step="${step}"]`);
    if(box){ box.textContent=''; box.classList.remove('show'); }
  }
  function showError(step,msg){
    const box = q(`[data-error-step="${step}"]`);
    if(box){ box.textContent = msg; box.classList.add('show'); }
  }

  function renderDetails(){
    const ids = selectedServiceIds();
    const box = q('#detailBox');
    if(!ids.length){
      box.innerHTML = '<div class="info-box">Bitte wählen Sie zuerst in Schritt 1 mindestens eine Dienstleistung aus.</div>';
      return;
    }
    box.innerHTML = ids.map(id => {
      const s = SERVICES.find(x => x.id === id);
      const opts = DETAIL_OPTIONS[id] || [];
      return `<div class="detail-group" data-service-id="${id}" style="margin-bottom:24px">
        <h3 style="margin:0 0 8px;color:var(--blue)">${esc(s.title)}</h3>
        <p class="small-muted" style="margin:0 0 12px">Bitte wählen Sie mindestens eine passende Option für ${esc(s.title)} aus.</p>
        <div class="chip-grid">${opts.map(o=>chip('details',o)).join('')}</div>
      </div>`;
    }).join('');
  }

  function getObjectValue(){ return val('#objectType'); }
  function getFrequencyValue(){ return val('#frequency'); }
  function getTimeValue(){ return val('#timeChoice'); }
  function getFloorValue(){ return val('#floorSelect'); }
  function getLocationValue(){ return [val('#postalCode'), val('#cityName')].filter(Boolean).join(' '); }
  function getSelectedFileNames(){ const input = q('#imageUpload'); return input && input.files ? [...input.files].map(file => file.name) : []; }
  function updateFileList(){ const list = q('#fileList'); if(!list) return; const files = getSelectedFileNames(); if(!files.length){ list.innerHTML=''; list.classList.add('hidden'); return; } list.classList.remove('hidden'); list.innerHTML = files.map(name => `<span class="file-item">${esc(name)}</span>`).join(''); }

  function validateStep(step, silent=false){
    if(!silent) clearError(step);
    const fail = msg => { if(!silent) showError(step,msg); return false; };
    if(step === 1 && checks('services').length < 1) return fail('Bitte wählen Sie mindestens eine Dienstleistung aus.');
    if(step === 2){
      const missing = missingDetailGroups();
      if(missing.length){
        return fail('Bitte wählen Sie bei jeder gewählten Hauptdienstleistung mindestens eine passende Option aus. Noch offen: ' + missing.join(', '));
      }
    }
    if(step === 3 && !getObjectValue()) return fail('Bitte wählen Sie eine Situation aus.');
    if(step === 4 && !getFrequencyValue()) return fail('Bitte wählen Sie die Pflegehäufigkeit aus.');
    if(step === 5 && !getTimeValue()) return fail('Bitte wählen Sie die Pflegedauer pro Einsatz aus.');
    if(step === 6){
      if(!getFloorValue()) return fail('Bitte wählen Sie die Pflegestufe / das Bedürfnis aus.');
      if(!radio('lift') || !radio('parkplatz') || !radio('schluessel_code') || !radio('arbeitszeiten')) return fail('Bitte beantworten Sie alle Zusatzfragen.');
    }
    if(step === 7){
      if(!val('#firstName') || !val('#lastName')) return fail('Bitte geben Sie Vorname und Nachname ein.');
      if(!val('#street') || !val('#postalCode') || !val('#cityName')) return fail('Bitte geben Sie Adresse, PLZ und Ort ein.');
      if(!val('#phone')) return fail('Bitte geben Sie eine Telefonnummer ein.');
      if(!/^\S+@\S+\.\S+$/.test(val('#email'))) return fail('Bitte geben Sie eine gültige E-Mail-Adresse ein.');
    }
    return true;
  }

  function getMaxAllowedStep(){
    let max = 1;
    for(let step=1; step<=total; step++){
      if(validateStep(step,true)){
        max = Math.min(step + 1, total);
      } else {
        max = step;
        break;
      }
    }
    return max;
  }

  function updateStepStates(){
    const maxAllowed = getMaxAllowedStep();
    qa('[data-step-node]').forEach(node => {
      const step = Number(node.dataset.stepNode);
      node.classList.remove('active','done','available','locked');
      if(step < current) node.classList.add('done');
      if(step === current) node.classList.add('active');
      if(step <= maxAllowed) node.classList.add('available');
      else node.classList.add('locked');
      const btn = node.querySelector('.step-btn');
      if(btn) btn.disabled = step > maxAllowed;
    });
  }

  function setStep(step){
    current = Math.max(1, Math.min(total, step));
    qa('.panel').forEach(p => p.classList.toggle('active', Number(p.dataset.step) === current));
    q('#stepText').textContent = `Schritt ${current} von ${total}`;
    q('#stepLabel').textContent = STEP_META[current] ? STEP_META[current].label : '';
    clearError(current);
    updateSummary();
    updateStepStates();
    window.scrollTo({top:app.offsetTop-20,behavior:'smooth'});
  }

  function renderMobileSummary(){
    const box = q('.mobile-summary');
    if(!box || window.innerWidth > 1350){ if(box) box.innerHTML=''; return; }
    box.innerHTML = `<div class="side" style="position:static;display:block"><h3 class="summary-title">Ihre Übersicht</h3><p class="summary-sub">Alle Angaben werden hier live zusammengefasst.</p><div class="summary-box">${qa('.summary-box .summary-row').map(r=>r.outerHTML).join('')}</div></div>`;
  }

  function detailsGroupedText(){
    const groups = selectedServiceIds().map(id => {
      const service = SERVICES.find(x => x.id === id);
      const group = q(`[data-service-id="${id}"]`);
      const selected = group ? [...group.querySelectorAll('input[name="details"]:checked')].map(x => x.value) : [];
      return selected.length ? `${service ? service.title : id}:\n- ${selected.join('\n- ')}` : `${service ? service.title : id}: noch offen`;
    });
    return groups.join('\n\n');
  }

  function updateSummary(){
    q('#sumServices').textContent = checks('services').join(', ') || 'Noch keine Auswahl';
    q('#sumDetails').textContent = detailsGroupedText() || 'Noch keine Auswahl';
    q('#sumObject').textContent = getObjectValue() || 'Noch keine Auswahl';
    q('#sumFrequency').textContent = getFrequencyValue() || 'Noch keine Auswahl';
    q('#sumTime').textContent = getTimeValue() || 'Noch keine Auswahl';
    const extras = [getFloorValue(), radio('lift') ? `Lift: ${radio('lift')}` : '', radio('parkplatz') ? `Parkplatz: ${radio('parkplatz')}` : ''].filter(Boolean).join(' / ');
    q('#sumExtra').textContent = extras || 'Noch keine Auswahl';
    q('#sumContact').textContent = [[val('#company')],[val('#firstName'),val('#lastName')].filter(Boolean).join(' '),getLocationValue(),val('#phone'),val('#email')].flat().filter(Boolean).join(' / ') || 'Noch keine Angaben';
    renderMobileSummary();
  }

  function buildSummary(){
    return [
      `Dienstleistung: ${checks('services').join(', ') || '-'}`,
      `Pflegebereich: ${detailsGroupedText() || '-'}`,
      `Situation: ${getObjectValue() || '-'}`,
      `Pflegehäufigkeit: ${getFrequencyValue() || '-'}`,
      `Dauer: ${getTimeValue() || '-'}`,
      `Pflegestufe / Bedürfnis: ${getFloorValue() || '-'}`,
      `Mobilität eingeschränkt: ${radio('lift') || '-'}`,
      `Angehörige involviert: ${radio('parkplatz') || '-'}`,
      `Ärztliche Verordnung vorhanden: ${radio('schluessel_code') || '-'}`,
      `Dringender Start gewünscht: ${radio('arbeitszeiten') || '-'}`,
      `Firma / Institution optional: ${val('#company') || '-'}`,
      `Vorname: ${val('#firstName') || '-'}`,
      `Nachname: ${val('#lastName') || '-'}`,
      `Strasse / Nr.: ${val('#street') || '-'}`,
      `PLZ / Ort: ${getLocationValue() || '-'}`,

      `E-Mail: ${val('#email') || '-'}`,

      `Ausgewählte Dateien: ${getSelectedFileNames().join(', ') || '-'}`,
      `Bilder / Dateilink: ${val('#imageLink') || '-'}`,
      `Bemerkungen: ${val('#message') || '-'}`
    ].join('\n');
  }

  async function submitForm(e){
    e.preventDefault();
    if(submitting) return;
    if(!validateStep(7)) return;
    submitting = true;
    const btn = q('#submitBtn');
    btn.disabled = true;
    btn.textContent = 'Demo wird angezeigt...';
    const payload = {
      client_id: CONFIG.clientId,
      company_name: CONFIG.companyName,
      form_type: 'spitex_lead',
      kundentyp: getObjectValue(),
      customer_type: getObjectValue(),
      pflege: checks('services').join('\n'),
      service: checks('services').join('\n'),
      services: checks('services').join('\n'),
      paket: detailsGroupedText(),
      package: detailsGroupedText(),
      // Keine Sammel-Extras senden: die Pflegeangaben werden darunter als einzelne, saubere Mail-Felder ausgegeben.
      extras: '',
      standort: getLocationValue(),
      location: getLocationValue(),
      vehicle: '',
      firma: val('#company'),
      company: val('#company'),
      vorname: val('#firstName'),
      first_name: val('#firstName'),
      nachname: val('#lastName'),
      last_name: val('#lastName'),
      strasse_nr: val('#street'),
      street: val('#street'),
      plz_ort: getLocationValue(),
      city: getLocationValue(),
      telefon: val('#phone'),
      phone: val('#phone'),
      email: val('#email'),
      nachricht: val('#message'),
      message: val('#message'),
      bild_link: val('#imageLink'),
      dateien_ausgewaehlt: getSelectedFileNames().join('\n'),
      regelmaessigkeit: getFrequencyValue(),
      pflegehaeufigkeit: getFrequencyValue(),
      pflegedauer: getTimeValue(),
      pflegestufe: getFloorValue(),
      mobilitaet_eingeschraenkt: radio('lift'),
      angehoerige_involviert: radio('parkplatz'),
      aerztliche_verordnung: radio('schluessel_code'),
      dringender_start: radio('arbeitszeiten'),
      wuensche: checks('wuensche').join('\n'),
      zusammenfassung: buildSummary(),
      website: val('#websiteField')
    };
    if(!payload.demo_order_local_json && typeof buildDigitalPlusMailOrderJson === 'function'){
      payload.demo_order_local_json = buildDigitalPlusMailOrderJson(payload);
    }

    let sentOk = false;

    try {
      if(!CONFIG.demoSubmitDisabledUrl){
        throw new Error('Submit URL fehlt.');
      }

      const body = new DemoLocalData();
      Object.keys(payload).forEach(key => {
        if(typeof shouldSkipDigitalPlusSubmitKey === 'function' && shouldSkipDigitalPlusSubmitKey(key, payload)) return;
        body.append(key, payload[key] == null ? '' : String(payload[key]));
      });

      const fileInput = q('#imageUpload');
      if(fileInput && fileInput.files && fileInput.files.length){
        [...fileInput.files].forEach(file => {
          body.append('bild_dateien[]', file);
        });
      }

      const response = await dpDemoSubmitDisabled(CONFIG.demoSubmitDisabledUrl, {
        method: 'POST',
        body
      });

      if(!response.ok){
        throw new Error('Serverantwort nicht erfolgreich: ' + response.status);
      }

      sentOk = true;
      const successBox = q('#successBox');
      if(successBox){
        successBox.textContent = CONFIG.successText || 'Projekt-/Demo-Version ohne Mailfunktion: Es wurden keine Daten übertragen und keine E-Mails versendet.';
        successBox.classList.add('show');
      } else {
        alert(CONFIG.successText || 'Projekt-/Demo-Version ohne Mailfunktion: Es wurden keine Daten übertragen und keine E-Mails versendet.');
      }
      btn.textContent = 'Gesendet';
    } catch(error) {
      showError(7, 'Beim Senden ist etwas schiefgelaufen. Bitte versuchen Sie es erneut oder kontaktieren Sie uns direkt.');
      console.error(error);
    } finally {
      submitting = false;
      if(!sentOk){
        btn.disabled = false;
        btn.textContent = 'Senden';
      }
    }
  }

  function handleServiceChange(){
    renderDetails();
    clearError(2);
    updateSummary();
    updateStepStates();
  }

  app.addEventListener('click', e => {
    const next = e.target.closest('[data-next]');
    if(next){
      if(current === 1) renderDetails();
      if(!validateStep(current)) return;
      setStep(Math.min(current + 1, total));
      return;
    }
    const prev = e.target.closest('[data-prev]');
    if(prev){
      setStep(Math.max(current - 1, 1));
      return;
    }
    const jump = e.target.closest('[data-step-target]');
    if(jump){
      const target = Number(jump.dataset.stepTarget);
      const maxAllowed = getMaxAllowedStep();
      if(target <= maxAllowed){
        setStep(target);
      } else if(target > maxAllowed){
        showError(current, `Bitte füllen Sie zuerst Schritt ${maxAllowed} korrekt aus, bevor Sie weiter nach vorne springen.`);
      }
    }
  });

  app.addEventListener('change', e => {
    if(e.target.matches('input[name="services"]')){
      handleServiceChange();
    }
    if(e.target.matches('input,select,textarea')){
      if(e.target.id === 'imageUpload') updateFileList();
      clearError(current);
      updateSummary();
      updateStepStates();
    }
  });

  app.addEventListener('input', e => {
    if(e.target.matches('input,select,textarea')){
      if(e.target.id === 'imageUpload') updateFileList();
      clearError(current);
      updateSummary();
      updateStepStates();
    }
  });

  q('#tokaForm').addEventListener('submit', submitForm);
  window.addEventListener('resize', renderMobileSummary);
  renderDetails();
  updateFileList();
  updateSummary();
  setStep(1);
})();

    {section:'Schritt 2 – Details', keys:['extras','objektart','object_type','projektart','groesse','haeufigkeit','regelmaessigkeit','wunschtermin','termin','dringlichkeit','kontaktwunsch']},
    {section:'Schritt 3 – Standort / Objekt', keys:['standort','location','strasse_nr','street','plz_ort','city','address','etage','lift','parkplatz']},
    {section:'Schritt 4 – Dateien / Zusatzangaben', keys:['dateien_ausgewaehlt','bild_link','file_link','wuensche','wunsch','bemerkungen','nachricht','message']},
    {section:'Schritt 5 – Kontaktangaben', keys:['firma','company','vorname','first_name','nachname','last_name','telefon','phone','email']}
  ];

  const profile = profiles[clientId] || defaultProfile;
  const sections = profile.map(function(section){ return {section:section.section, fields:[], keys:section.keys || []}; });
  const used = new Set();
  const canonicalSeen = {};

  function cleanValue(value){
    if(value === null || value === undefined) return '';
    return String(value).replace(/\r\n/g,'\n').trim();
  }

  function hasValue(value){
    const text = cleanValue(value);
    if(!text) return false;
    const lower = text.toLowerCase();
    return lower !== '-' && lower !== 'null' && lower !== 'undefined' && lower !== 'keine angabe' && lower !== 'keine dateien';
  }

  function canonicalFor(key){
    const lower = String(key || '').toLowerCase();
    return aliasCanonical[lower] || lower;
  }

  function labelFor(key){
    if(labelMap[key]) return labelMap[key];
    const lower = String(key || '').toLowerCase();
    if(labelMap[lower]) return labelMap[lower];
    return String(key || '')
      .replace(/ae/g,'ä').replace(/oe/g,'ö').replace(/ue/g,'ü')
      .replace(/_/g,' ')
      .replace(/-/g,' ')
      .replace(/\s+/g,' ')
      .replace(/\b\w/g, function(letter){return letter.toUpperCase();});
  }

  function shouldAddVisible(key){
    if(!key) return false;
    const lower = String(key).toLowerCase();
    if(technicalKeys.has(lower)) return false;
    const value = data[key];
    if(!hasValue(value)) return false;

    const canonical = canonicalFor(key);
    const signature = cleanValue(value).toLowerCase().replace(/\s+/g,' ');
    if(canonicalSeen[canonical] && canonicalSeen[canonical] === signature) return false;
    canonicalSeen[canonical] = signature;
    return true;
  }

  function findSectionByKey(key){
    const lower = String(key || '').toLowerCase();
    for(const section of sections){
      if((section.keys || []).map(function(k){return String(k).toLowerCase();}).indexOf(lower) !== -1){
        return section;
      }
    }

    // Fallback-Zuordnung für dynamische Formularfelder, damit keine englischen Zusatzblöcke entstehen.
    if(/firma|vorname|nachname|telefon|phone|email|kontakt/.test(lower)) return sections[sections.length - 1];
    if(/zahlung|payment|subtotal|total|price|preis/.test(lower)) return sections.find(function(s){return /zahlung|preis/i.test(s.section);}) || sections[sections.length - 1];
    if(/adresse|standort|location|ort|plz|street|strasse|floor|stockwerk|lift|park|zugang|zufahrt|tragweg|termin|datum|zeit|when/.test(lower)) return sections.find(function(s){return /standort|objekt|zugang|zeit|eckdaten|termin/i.test(s.section);}) || sections[0];
    if(/nachricht|message|bemerk|datei|bild|wunsch/.test(lower)) return sections.find(function(s){return /details|informationen|absenden|abschluss|zusatz|kontakt/i.test(s.section);}) || sections[sections.length - 1];
    if(/service|dienst|leistung|reinigung|pflege/.test(lower)) return sections.find(function(s){return /dienstleistung|leistung|reinigung|pflege/i.test(s.section);}) || sections[0];
    return sections.find(function(s){return /details|umfang|informationen/i.test(s.section);}) || sections[0];
  }

  function addField(key){
    if(used.has(key)) return;
    used.add(key);
    if(!shouldAddVisible(key)) return;
    findSectionByKey(key).fields.push({name:key, label:labelFor(key)});
  }

  sections.forEach(function(section){
    (section.keys || []).forEach(function(key){ addField(key); });
  });

  Object.keys(data).forEach(function(key){ addField(key); });

  return JSON.stringify(sections
    .filter(function(section){ return section.fields && section.fields.length; })
    .map(function(section){ return {section:section.section, fields:section.fields}; })
  );
}

function shouldSkipDigitalPlusSubmitKey(key, data){
  data = data || {};
  if(!key) return true;
  const value = data[key];
  const text = value === null || value === undefined ? '' : String(value).trim();
  const lower = String(key).toLowerCase();

  // Leere Felder nicht unnötig an den Hub senden – ausser Honeypot, wenn er befüllt wäre.
  if(!text) return true;

  const aliasCanonical = {
    customer_type:'kundentyp', reinigung:'service', dienstleistung:'service', services:'service', pflege:'service', pflegeleistung:'service',
    package:'paket', details:'paket', detail:'details', company:'firma', first_name:'vorname', firstname:'vorname', last_name:'nachname', lastname:'nachname',
    phone:'telefon', tel:'telefon', mobile:'telefon', street:'strasse_nr', city:'plz_ort', location:'standort', message:'nachricht', e_mail:'email', mail:'email'
  };

  const canonical = aliasCanonical[lower];
  if(canonical && data[canonical] !== null && data[canonical] !== undefined){
    const original = String(data[canonical]).trim().toLowerCase().replace(/\s+/g,' ');
    const aliasValue = text.toLowerCase().replace(/\s+/g,' ');
    if(original && original === aliasValue) return true;
  }

  return false;
}


</script>

<script id="dp-demo-no-mail-script">
(function(){
  'use strict';
  var DEMO_TEXT = 'Danke für den Versuch, dieses Formular abzuschicken. Dieses Formular ist eine Projekt- und Testversion. Die Versandfunktion ist deaktiviert. Es wurden keine Daten übertragen und keine E-Mails versendet.';
  var DEMO_NOTE = 'Alle Auswahlfelder, Schritte und die Übersicht funktionieren weiterhin als Vorschau. Es wird jedoch kein Kontaktformular ausgelöst.';
  window.CONFIG = Object.assign({}, window.CONFIG || {}, { demoMode:true, mailFunctionDisabled:true, noMailMessage:DEMO_TEXT });
  function ensureModal(){
    var modal=document.getElementById('dpDemoNoMailModal');
    if(modal) return modal;
    modal=document.createElement('div');
    modal.id='dpDemoNoMailModal';
    modal.className='dp-demo-modal-backdrop';
    modal.setAttribute('role','dialog');
    modal.setAttribute('aria-modal','true');
    modal.innerHTML='<div class="dp-demo-modal"><div class="dp-demo-modal-head"><strong>Projektversion – kein Versand</strong></div><div class="dp-demo-modal-body"><p>'+DEMO_TEXT+'</p><div class="dp-demo-modal-note">'+DEMO_NOTE+'</div><button type="button" class="dp-demo-modal-btn">Verstanden</button></div></div>';
    document.body.appendChild(modal);
    modal.querySelector('button').addEventListener('click',function(){modal.classList.remove('is-open');});
    modal.addEventListener('click',function(e){if(e.target===modal) modal.classList.remove('is-open');});
    return modal;
  }
  function addInlineNote(form){
    if(!form) return;
    var note=form.querySelector('.dp-demo-inline-note');
    if(!note){
      note=document.createElement('div');
      note.className='dp-demo-inline-note';
      note.textContent=DEMO_TEXT;
      form.appendChild(note);
    }
  }
  window.dpShowDemoNoMailModal=function(form){addInlineNote(form||document.querySelector('form'));ensureModal().classList.add('is-open');};
  window.dpDemoSubmitDisabled=async function(){window.dpShowDemoNoMailModal(document.querySelector('form'));return {ok:true,status:200,text:async function(){return '{"success":true}';},json:async function(){return {success:true,demoMode:true};}}};
  window.DemoLocalData=function(){this.items=[];};
  window.DemoLocalData.prototype.append=function(k,v){this.items.push([k,v]);};
  window.DemoLocalData.prototype.set=function(k,v){this.delete(k);this.append(k,v);};
  window.DemoLocalData.prototype.delete=function(k){this.items=this.items.filter(function(i){return i[0]!==k;});};
  window.DemoLocalData.prototype.get=function(k){var x=this.items.find(function(i){return i[0]===k;});return x?x[1]:null;};
  window.DemoLocalData.prototype.entries=function(){return this.items[Symbol.iterator]();};
  document.addEventListener('submit',function(e){
    var form=e.target;
    if(!form || !form.matches || !form.matches('form')) return;
    if(form.checkValidity && !form.checkValidity()){return;}
    e.preventDefault();
    e.stopImmediatePropagation();
    window.dpShowDemoNoMailModal(form);
  }, true);
})();
</script>
