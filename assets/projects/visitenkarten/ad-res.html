<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Professionelle digitale Visitenkarte - AD-RES</title>
<style>

:root {
  --brand: #00508c;
  --brand-dark: #0b3558;
  --brand-2: #101827;
  --brand-rgb: 0,80,140;
  --soft: #eaf4fb;
  --ink: #101827;
  --muted: #667085;
  --paper: #ffffff;
  --radius-xl: clamp(26px, 4vw, 44px);
  --radius-card: clamp(18px, 2.4vw, 30px);
  --card-ratio: 400 / 700;
  --card-max: 400px;
  --card-width: 54vw;
  --card-mobile-width: 74vw;
  --stage-height: min(78vh, 720px);
  --stage-min: 540px;
  --stage-mobile-height: clamp(430px, 64vh, 590px);
  --stage-mobile-min: 410px;
  --shadow-width: 390px;
  --thickness: 12px;
}
* { box-sizing: border-box; }
html { min-height: 100%; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100dvh;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 14%, rgba(var(--brand-rgb), .22), transparent 32%),
    radial-gradient(circle at 86% 16%, rgba(16, 24, 39, .10), transparent 32%),
    radial-gradient(circle at 76% 92%, rgba(var(--brand-rgb), .12), transparent 38%),
    linear-gradient(135deg, #ffffff 0%, var(--soft) 54%, #ffffff 100%);
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .34;
  background:
    linear-gradient(120deg, transparent 0 47%, rgba(var(--brand-rgb), .18) 48%, transparent 51% 100%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.34) 0 1px, transparent 1px 18px);
}
img { max-width: 100%; }
button { font: inherit; }
.page {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: clamp(34px, 5vw, 68px) clamp(16px, 4vw, 28px) clamp(52px, 7vw, 88px);
}
.hero {
  max-width: 880px;
  margin: 0 auto clamp(30px, 5vw, 50px);
  text-align: center;
}
.kicker {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 0 0 14px;
  padding: 8px 14px;
  border-radius: 999px;
  color: var(--brand-dark);
  background: rgba(var(--brand-rgb), .10);
  border: 1px solid rgba(var(--brand-rgb), .14);
  font-size: 12px;
  line-height: 1;
  letter-spacing: .16em;
  text-transform: uppercase;
  font-weight: 900;
}
h1 {
  margin: 0;
  font-size: clamp(34px, 6vw, 76px);
  line-height: .94;
  letter-spacing: -.06em;
}
h1 span, .accent { color: var(--brand); }
.lead {
  max-width: 760px;
  margin: clamp(15px, 2vw, 20px) auto 0;
  color: var(--muted);
  font-size: clamp(16px, 2vw, 20px);
  line-height: 1.65;
}
.showcase {
  display: grid;
  grid-template-columns: repeat(2, minmax(260px, 1fr));
  gap: clamp(18px, 3vw, 34px);
  align-items: start;
  margin: 0 auto clamp(44px, 7vw, 76px);
}
.cardFrame {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-xl);
  padding: clamp(16px, 2.5vw, 28px);
  background: rgba(255,255,255,.72);
  border: 1px solid rgba(255,255,255,.84);
  box-shadow: 0 24px 70px rgba(16,24,39,.12);
  backdrop-filter: blur(18px);
}
.cardFrame::after {
  content: "";
  position: absolute;
  inset: auto 28px 0;
  height: 3px;
  border-radius: 999px 999px 0 0;
  background: linear-gradient(90deg, transparent, rgba(var(--brand-rgb), .55), transparent);
}
.label {
  margin: 0 0 16px;
  color: var(--brand-dark);
  font-size: 13px;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: .14em;
  font-weight: 900;
}
.fullCard {
  width: 100%;
  height: auto;
  display: block;
  border-radius: var(--radius-card);
  background: var(--paper);
  box-shadow: 0 24px 60px rgba(16,24,39,.18);
}
.interactive {
  position: relative;
  margin: 0 auto;
  padding: clamp(24px, 4vw, 46px) clamp(16px, 3vw, 32px) clamp(28px, 4.5vw, 54px);
  border-radius: var(--radius-xl);
  background: rgba(255,255,255,.66);
  border: 1px solid rgba(255,255,255,.86);
  box-shadow: 0 30px 90px rgba(16,24,39,.12);
  text-align: center;
  overflow: hidden;
  backdrop-filter: blur(18px);
}
.interactive::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 6%, rgba(var(--brand-rgb), .16), transparent 30%),
    linear-gradient(180deg, rgba(255,255,255,.40), transparent 46%);
}
.interactive > * { position: relative; z-index: 1; }
.interactive h2 {
  margin: 0 0 10px;
  font-size: clamp(28px, 4vw, 50px);
  line-height: 1;
  letter-spacing: -.045em;
}
.hint {
  max-width: 660px;
  margin: 0 auto clamp(20px, 3vw, 34px);
  color: var(--muted);
  font-size: clamp(15px, 1.7vw, 17px);
  line-height: 1.6;
}
.scene {
  position: relative;
  height: var(--stage-height);
  min-height: var(--stage-min);
  display: grid;
  place-items: center;
  perspective: 1500px;
  cursor: grab;
  user-select: none;
  touch-action: none;
  outline: none;
  overscroll-behavior: contain;
}
.scene:active { cursor: grabbing; }
.scene:focus-visible {
  border-radius: 26px;
  box-shadow: 0 0 0 4px rgba(var(--brand-rgb), .22);
}
.scene::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 10%;
  width: min(var(--shadow-width), 88vw);
  height: 32px;
  border-radius: 50%;
  transform: translateX(-50%);
  background: rgba(16,24,39,.16);
  filter: blur(18px);
  opacity: .9;
}
.model {
  width: min(var(--card-width), var(--card-max));
  aspect-ratio: var(--card-ratio);
  position: relative;
  z-index: 2;
  transform-style: preserve-3d;
  transform: rotateX(var(--rx, -8deg)) rotateY(var(--ry, -24deg));
  transition: transform .16s ease-out;
  will-change: transform;
}
.model::before {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: calc(var(--radius-card) + 2px);
  transform: translateZ(calc(var(--thickness) * -1));
  background: linear-gradient(135deg, rgba(var(--brand-rgb), .22), rgba(255,255,255,.88) 45%, rgba(16,24,39,.12));
  box-shadow: inset 0 0 0 1px rgba(16,24,39,.06);
}
.face {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: var(--radius-card);
  background: var(--paper);
  box-shadow: 0 32px 82px rgba(16,24,39,.24);
  border: 1px solid rgba(255,255,255,.94);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.face img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  background: var(--paper);
  pointer-events: none;
  -webkit-user-drag: none;
}
.face.front { transform: translateZ(var(--thickness)); }
.face.back { transform: rotateY(180deg) translateZ(var(--thickness)); }
.edge {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-card);
  transform: translateZ(0);
  background: linear-gradient(90deg, rgba(16,24,39,.16), rgba(255,255,255,.94) 50%, rgba(var(--brand-rgb), .18));
  box-shadow: inset 0 0 0 1px rgba(16,24,39,.07);
}
.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: clamp(16px, 2.5vw, 26px);
}
.control {
  appearance: none;
  border: 1px solid rgba(var(--brand-rgb), .18);
  border-radius: 999px;
  padding: 11px 16px;
  background: rgba(255,255,255,.74);
  color: var(--brand-dark);
  font-weight: 850;
  cursor: pointer;
  box-shadow: 0 10px 24px rgba(16,24,39,.08);
  transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
}
.control:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(16,24,39,.12); }
.control:active { transform: translateY(0); }
.control.primary {
  color: #fff;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  border-color: transparent;
}
.extraInfo {
  margin: clamp(20px, 3vw, 30px) auto 0;
  max-width: 820px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.6;
}
.extraInfo .details {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
.extraInfo .pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  padding: 9px 13px;
  background: rgba(var(--brand-rgb), .10);
  border: 1px solid rgba(var(--brand-rgb), .14);
  color: var(--brand-dark);
  font-weight: 750;
}
.extraInfo .note, .extraInfo p {
  margin: 0;
}
@media (max-width: 980px) {
  .page { width: min(900px, 100%); }
  .scene { height: min(var(--stage-height), 62vh); }
}
@media (max-width: 760px) {
  .page { padding: 34px 16px 58px; }
  .hero { margin-bottom: 28px; }
  h1 { font-size: clamp(32px, 10vw, 52px); }
  .lead { font-size: 16px; line-height: 1.55; }
  .showcase { grid-template-columns: 1fr; gap: 22px; margin-bottom: 42px; }
  .cardFrame { border-radius: 28px; padding: 16px; }
  .fullCard { border-radius: 20px; }
  .interactive { border-radius: 30px; }
  .scene {
    height: var(--stage-mobile-height);
    min-height: var(--stage-mobile-min);
  }
  .model { width: min(var(--card-mobile-width), var(--card-max)); }
  .scene::after { bottom: 8%; }
  .controls { gap: 8px; }
  .control { padding: 10px 13px; font-size: 14px; }
}
@media (max-width: 430px) {
  .kicker { font-size: 11px; letter-spacing: .12em; }
  .interactive { padding-inline: 12px; }
  .control { flex: 1 1 calc(50% - 8px); min-width: 136px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: .001ms !important; animation-duration: .001ms !important; }
}

</style>
</head>

    <div class="controls" aria-label="3D-Steuerung">
      <button class="control primary" type="button" data-action="auto" aria-pressed="true">Auto stoppen</button>
      <button class="control" type="button" data-action="front">Vorderseite</button>
      <button class="control" type="button" data-action="back">Rückseite</button>
      <button class="control" type="button" data-action="reset">Zurücksetzen</button>
    </div>
    
  </section>
</main>

<script>
(() => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-card-scene]').forEach((scene) => {
    const model = scene.querySelector('.model');
    const area = scene.closest('.interactive');
    if (!model || !area) return;

    let dragging = false;
    let startX = 0;
    let startY = 0;
    let rotX = -8;
    let rotY = -24;
    let auto = !reduceMotion;
    const autoButton = area.querySelector('[data-action="auto"]');

    const paint = () => {
      model.style.setProperty('--rx', `${rotX}deg`);
      model.style.setProperty('--ry', `${rotY}deg`);
    };

    const setAuto = (value) => {
      auto = Boolean(value);
      if (autoButton) {
        autoButton.textContent = auto ? 'Auto stoppen' : 'Automatisch drehen';
        autoButton.setAttribute('aria-pressed', String(auto));
      }
    };

    const goTo = (x, y) => {
      setAuto(false);
      rotX = x;
      rotY = y;
      paint();
    };

    scene.addEventListener('pointerdown', (event) => {
      dragging = true;
      setAuto(false);
      startX = event.clientX;
      startY = event.clientY;
      model.style.transition = 'none';
      try { scene.setPointerCapture(event.pointerId); } catch (error) {}
    });

    scene.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      const dx = event.clientX - startX;
      const dy = event.clientY - startY;
      startX = event.clientX;
      startY = event.clientY;
      rotY += dx * 0.45;
      rotX -= dy * 0.28;
      rotX = Math.max(-50, Math.min(50, rotX));
      paint();
    });

    const stopDrag = () => {
      if (!dragging) return;
      dragging = false;
      model.style.transition = '';
    };
    scene.addEventListener('pointerup', stopDrag);
    scene.addEventListener('pointercancel', stopDrag);
    scene.addEventListener('lostpointercapture', stopDrag);

    scene.addEventListener('dblclick', () => {
      const normalized = ((rotY % 360) + 360) % 360;
      goTo(-6, normalized > 90 && normalized < 270 ? 0 : 180);
    });

    scene.addEventListener('keydown', (event) => {
      const step = event.shiftKey ? 18 : 8;
      if (event.key === 'ArrowLeft') { setAuto(false); rotY -= step; event.preventDefault(); }
      if (event.key === 'ArrowRight') { setAuto(false); rotY += step; event.preventDefault(); }
      if (event.key === 'ArrowUp') { setAuto(false); rotX = Math.max(-50, rotX - step); event.preventDefault(); }
      if (event.key === 'ArrowDown') { setAuto(false); rotX = Math.min(50, rotX + step); event.preventDefault(); }
      if (event.key === 'Home') { goTo(-8, -24); event.preventDefault(); }
      paint();
    });

    area.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('click', () => {
        const action = button.getAttribute('data-action');
        if (action === 'auto') { setAuto(!auto); return; }
        if (action === 'front') { goTo(-6, 0); return; }
        if (action === 'back') { goTo(-6, 180); return; }
        if (action === 'reset') { goTo(-8, -24); }
      });
    });

    const loop = () => {
      if (auto && !dragging && document.visibilityState === 'visible') {
        rotY += 0.18;
        paint();
      }
      requestAnimationFrame(loop);
    };

    paint();
    setAuto(auto);
    requestAnimationFrame(loop);
  });
})();
</script>
