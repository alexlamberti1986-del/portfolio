<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>MULTIVERSUM — Lokale Testvorschau</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #0b1220;
      color: #e8eef8;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      padding: clamp(24px, 4vw, 36px);
      border-radius: 20px;
      background: rgba(18, 32, 56, 0.85);
      border: 1px solid rgba(255, 90, 177, 0.28);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.45rem; }
    p { margin: 0 0 1.25rem; line-height: 1.6; opacity: 0.9; font-size: 0.95rem; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 999px;
      border: none;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, #ff59b2, #ff9b37 55%, #40b1ff);
      box-shadow: 0 10px 32px rgba(255, 90, 177, 0.25);
    }
    .hint { margin-top: 1rem; font-size: 0.82rem; opacity: 0.65; line-height: 1.5; }
  </style>
  <script>location.replace("multiversum-preview.html");</script>
</head>
<body>
  <div class="card">
    <h1>4-Welten-Testvorschau</h1>
    <p>MULTIVERSUM + NEXORA + PROFESSIONAL + FREIRAUM — gleicher Aufbau, Logo führt zu MULTIVERSUM.</p>
    <a class="btn" href="multiversum-preview.html">Vorschau starten</a>
    <p class="hint">Nur lokal. Nicht live auf alexlamberti.ch.</p>
  </div>
</body>
</html>
