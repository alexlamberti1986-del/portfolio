<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Übergang testen — FREIRAUM</title>
  <link rel="stylesheet" href="world-transition.css" />
</head>
<body class="demo-page demo-page--freiraum">
  <h1>FREIRAUM Portal-Übergang</h1>
  <p>
  Farbiger Aurora-Tunnel mit flüssigen Lichtbändern und Partikeln — kreativ und offen.
  Der Effekt entsteht am geklickten Element und endet in einem farbigen Lichtdurchbruch.
  </p>

  <div class="demo-actions">
    <button
      type="button"
      class="demo-world-btn demo-world-btn--freiraum"
      data-world-transition="freiraum"
      data-target="#fertig-freiraum"
      id="btn-freiraum"
    >
      FREIRAUM — Portal starten
    </button>
  </div>

  <p class="demo-hint">
  Referenz: FREIRAUM.mp4 · Dauer ca. 4,2 s
  </p>

  <p>
    <a class="demo-back" href="index.html">Alle Demos</a>
    ·
    <a class="demo-back" href="demo-nexora.html">NEXORA</a>
    ·
    <a class="demo-back" href="demo-professional.html">PROFESSIONAL</a>
  </p>

  <script src="world-transition.js"></script>
  <script>
    document.getElementById("btn-freiraum").addEventListener("click", function (e) {
      e.preventDefault();
      AlexWorldTransition.launch({
        world: "freiraum",
        originElement: e.currentTarget,
        onComplete: function () {
          alert("FREIRAUM-Übergang beendet — hier würde z. B. FREIRAUM.html geladen.");
        },
      });
    });
  </script>
</body>
</html>
