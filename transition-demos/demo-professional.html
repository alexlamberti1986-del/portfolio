<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Übergang testen — PROFESSIONAL</title>
  <link rel="stylesheet" href="world-transition.css" />
</head>
<body class="demo-page demo-page--professional">
  <h1>PROFESSIONAL Portal-Übergang</h1>
  <p>
  Schwarz-weisser geometrischer Tunnel mit Schachbrett-Tiefe — ruhiger und edler als NEXORA.
  Klick startet das Portal am Button, danach Fahrt durch den Raum und heller Exit.
  </p>

  <div class="demo-actions">
    <button
      type="button"
      class="demo-world-btn demo-world-btn--professional"
      data-world-transition="professional"
      data-target="#fertig-professional"
      id="btn-professional"
    >
      PROFESSIONAL — Portal starten
    </button>
  </div>

  <p class="demo-hint">
  Referenz: PROFESSIONAL.mp4 · Dauer ca. 4,2 s
  </p>

  <p>
    <a class="demo-back" href="index.html">Alle Demos</a>
    ·
    <a class="demo-back" href="demo-nexora.html">NEXORA</a>
    ·
    <a class="demo-back" href="demo-freiraum.html">FREIRAUM</a>
  </p>

  <script src="world-transition.js"></script>
  <script>
    document.getElementById("btn-professional").addEventListener("click", function (e) {
      e.preventDefault();
      AlexWorldTransition.launch({
        world: "professional",
        originElement: e.currentTarget,
        onComplete: function () {
          alert("PROFESSIONAL-Übergang beendet — hier würde z. B. PROFESSIONAL.html geladen.");
        },
      });
    });
  </script>
</body>
</html>
